server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The editor origin holds the API session token and public AI provider selections,
  # so no third-party origin may execute script here. Every runtime the editor
  # needs, including the Font Awesome and Heroicons icon runtimes, is a bundled
  # workspace dependency served from this origin; script-src therefore carries no
  # host source at all and editorContentSecurityPolicy.conformance.test.ts fails
  # if one is reintroduced.
  # script-src carries no 'unsafe-inline': the inline <script type="importmap">
  # that once required it went away with the ESM bridge. The remaining
  # 'unsafe-inline' is on style-src only, for the style attributes the PIR
  # renderer writes per node.
  # AI drafts use the same-origin server gateway. connect-src keeps https:
  # for authorized asset/runner hosts configured by deployments; deployments
  # should narrow connect-src and frame-src to their actual host allowlist.
  # Plaintext http sources are loopback-only. A bare `http:` is inert on an https
  # deployment — the browser blocks it as mixed content — and grants every
  # downgraded origin on an http one, so it only ever loosens the weaker case.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:*; font-src 'self' data: https:; media-src 'self' data: blob: https: http://localhost:*; worker-src 'self' blob:; frame-src 'self' blob: https: http://localhost:*; connect-src 'self' blob: data: https: wss: http://localhost:* ws://localhost:*" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
