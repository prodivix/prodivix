name: G4 V4 Durable Control Plane

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g4-v4-control-plane.yml'
      - 'apps/backend/go.mod'
      - 'apps/backend/go.sum'
      - 'apps/backend/internal/modules/agent/**'
      - 'apps/backend/internal/platform/agentcontract/**'
      - 'apps/backend/internal/platform/canonicaljson/**'
      - 'apps/backend/internal/platform/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/ai/**'
      - 'packages/golden-conformance/**'
      - 'packages/shared/**'
      - 'scripts/check-core-package-boundaries.mjs'
      - 'scripts/check-g4-boundaries.mjs'
      - 'scripts/g4-agent-control-canonical-vector.mjs'
      - 'scripts/sync-g4-wire-contracts.mjs'
      - 'scripts/verify-g4-control-plane-postgres.mjs'
      - 'specs/decisions/65.verified-agent-task-and-control-plane.md'
      - 'specs/implementation/g4-verified-agentic-development.md'
      - 'specs/roadmap/current-status.md'
      - 'specs/roadmap/g4-closure-evidence.md'
      - 'specs/roadmap/g4-verified-agentic-development-milestones.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/g4-v4-control-plane.yml'
      - 'apps/backend/go.mod'
      - 'apps/backend/go.sum'
      - 'apps/backend/internal/modules/agent/**'
      - 'apps/backend/internal/platform/agentcontract/**'
      - 'apps/backend/internal/platform/canonicaljson/**'
      - 'apps/backend/internal/platform/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/ai/**'
      - 'packages/golden-conformance/**'
      - 'packages/shared/**'
      - 'scripts/check-core-package-boundaries.mjs'
      - 'scripts/check-g4-boundaries.mjs'
      - 'scripts/g4-agent-control-canonical-vector.mjs'
      - 'scripts/sync-g4-wire-contracts.mjs'
      - 'scripts/verify-g4-control-plane-postgres.mjs'
      - 'specs/decisions/65.verified-agent-task-and-control-plane.md'
      - 'specs/implementation/g4-verified-agentic-development.md'
      - 'specs/roadmap/current-status.md'
      - 'specs/roadmap/g4-closure-evidence.md'
      - 'specs/roadmap/g4-verified-agentic-development-milestones.md'

concurrency:
  group: g4-v4-control-plane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plane:
    name: Task, Run, recovery, idempotency, and PostgreSQL Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prodivix_g4_v4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prodivix_g4_v4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRODIVIX_BACKEND_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/prodivix_g4_v4?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify deterministic V4 control contracts and recovery matrix
        run: pnpm run verify:g4:control-plane:core
      - name: Verify real PostgreSQL durability and fencing
        run: pnpm run verify:g4:control-plane:postgres
