concurrency:
  group: g4-v9-golden-closure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-golden:
    name: Zero-remote-token Golden, PostgreSQL, browser, and rootless Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prodivix_g4_v9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prodivix_g4_v9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRODIVIX_BACKEND_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/prodivix_g4_v9?sslmode=disable
      PRODIVIX_G4_REMOTE_MODEL_UNITS: '0'
      PRODIVIX_G4_REPOSITORY_COMMIT: ${{ github.sha }}
      PRODIVIX_G4_WORKTREE_STATE: clean
      PRODIVIX_G4_DETERMINISTIC_GATE_EVIDENCE: github-actions
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Attest pre-adopted runner image
        shell: bash
        run: |
          set -euo pipefail
          test "${ImageOS:-}" = 'ubuntu24'
          case "${ImageVersion:-}" in
            20260720.247.2|20260726.254.1|20260810.271.1) ;;
            *)
              echo "::error::Runner ImageVersion is not pre-adopted: ${ImageVersion:-missing}"
              exit 1
              ;;
          esac
          test "$(uname -m)" = 'x86_64'
          test "$(uname -r)" = '6.17.0-1020-azure' -o "$(uname -r)" = '6.17.0-1022-azure'
          echo "PRODIVIX_G3_V6_RUNNER_IMAGE_OS=${ImageOS}" >> "${GITHUB_ENV}"
          echo "PRODIVIX_G3_V6_RUNNER_IMAGE_VERSION=${ImageVersion}" >> "${GITHUB_ENV}"
      - name: Configure and verify pre-adopted rootless Podman
        shell: bash
        run: bash scripts/ci/configure-rootless-podman.sh g4-v9-rootless-podman-info.json
      - name: Build immutable controlled static toolchain sandbox
        shell: bash
        run: |
          set -euo pipefail
          base_image="docker.io/library/node:22.23.1-bookworm-slim"
          image_tag="localhost/prodivix-g4-v9-controlled-static:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/ci/pull-rootless-podman-image.sh "${base_image}"
          base_digest="$(podman image inspect --format '{{.Digest}}' "${base_image}")"
          test "${base_digest#sha256:}" != "${base_digest}"
          podman build \
            --pull=never \
            --build-arg "NODE_IMAGE=docker.io/library/node@${base_digest}" \
            --file apps/remote-runner-worker/controlled-static-sandbox/Dockerfile \
            --tag "${image_tag}" \
            .
          image_id="$(podman image inspect --format '{{.Id}}' "${image_tag}")"
          if [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            image_digest="${image_id}"
          elif [[ "${image_id}" =~ ^[0-9a-f]{64}$ ]]; then
            image_digest="sha256:${image_id}"
          else
            echo "::error::Controlled static sandbox image id is not a canonical SHA-256 digest."
            exit 1
          fi
          echo "PRODIVIX_CONTROLLED_STATIC_SANDBOX_IMAGE=${image_digest}" >> "${GITHUB_ENV}"
      - name: Install Playwright browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build Golden dependency closure
        run: pnpm run build:g2-golden-dependencies
      - name: Attest installed Playwright browser images
        run: pnpm --filter @prodivix/golden-conformance test:g3-v6-browser-image-authority
      - name: Verify rootless runtime
        shell: bash
        env:
          PRODIVIX_ROOTLESS_EVIDENCE_PATH: g4-v9-rootless-sandbox-gate.json
          REMOTE_WORKER_TOKEN: g4-v9-rootless-gate-canary-not-secret
        run: |
          set -euo pipefail
          install_network="prodivix-g4-v9-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          proxy_egress_network="prodivix-g4-v9-proxy-egress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          proxy_container="prodivix-g4-v9-install-proxy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          proxy_image="localhost/prodivix-g4-v9-install-proxy:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          base_image="docker.io/library/node:22-bookworm-slim"
          bash scripts/ci/pull-rootless-podman-image.sh "${base_image}"
          base_digest="$(podman image inspect --format '{{.Digest}}' "${base_image}")"
          podman build \
            --pull=never \
            --build-arg "NODE_IMAGE=docker.io/library/node@${base_digest}" \
            --file apps/remote-runner-worker/install-proxy/Dockerfile \
            --tag "${proxy_image}" \
            .

          podman network create --internal "${install_network}"
          podman network create "${proxy_egress_network}"
          podman run \
            --detach \
            --name "${proxy_container}" \
            --network "${proxy_egress_network}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --env PRODIVIX_INSTALL_EGRESS_ALLOWLIST=registry.npmjs.org \
            "${proxy_image}"
          podman network connect "${install_network}" "${proxy_container}"
          cleanup() {
            podman rm --force --ignore "${proxy_container}"
            podman network rm --force "${install_network}" "${proxy_egress_network}"
          }
          trap cleanup EXIT

          export PRODIVIX_ROOTLESS_INSTALL_NETWORK="${install_network}"
          export PRODIVIX_ROOTLESS_INSTALL_PROXY_URL="http://${proxy_container}:8080/"
          export PRODIVIX_ROOTLESS_INSTALL_PROXY_CONTAINER="${proxy_container}"
          set +e
          pnpm run verify:g4:rootless 2>&1 | tee g4-v9-rootless-sandbox-gate.log
          gate_status="${PIPESTATUS[0]}"
          set -e
          podman logs "${proxy_container}" > g4-v9-rootless-install-egress-traces.jsonl
          exit "${gate_status}"
      - name: Upload rootless runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g4-v9-rootless-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            g4-v9-rootless-podman-info.json
            g4-v9-rootless-sandbox-gate.json
            g4-v9-rootless-sandbox-gate.log
            g4-v9-rootless-install-egress-traces.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Verify exact deterministic G4 aggregate and authenticated Catalog Golden
        env:
          PRODIVIX_G4_V9_MANIFEST_PATH: ${{ runner.temp }}/prodivix-g4-v9-closure-manifest.json
        run: pnpm run verify:g4
      - name: Confirm ordinary CI consumed no remote model units
        shell: bash
        run: test "${PRODIVIX_G4_REMOTE_MODEL_UNITS}" = '0'
      - name: Upload deterministic V9 Closure manifest
        id: upload_deterministic_closure
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g4-v9-deterministic-closure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prodivix-g4-v9-closure-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Record deterministic Closure artifact identity
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_deterministic_closure.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          artifact_digest="${ARTIFACT_DIGEST}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${artifact_digest}"
          fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Deterministic G4 V9 Closure authority'
            echo "- source run: \`${GITHUB_RUN_ID}\`"
            echo "- source attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- artifact: \`g4-v9-deterministic-closure-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}\`"
            echo "- artifact SHA-256: \`${artifact_digest}\`"
            echo '- qualification: deterministic authority only; real-model Closure remains Evidence pending'
          } >> "${GITHUB_STEP_SUMMARY}"
