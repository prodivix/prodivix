name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check "{apps,packages,specs,scripts}/**/*.{ts,tsx,js,jsx,json,md,yml,yaml,scss,css,html}" "*.{json,md,yml,yaml}"

      - name: Lint
        run: pnpm run lint

      - name: Test workspaces without web
        run: pnpm turbo run test --filter=!@prodivix/web

      - name: Test web
        run: pnpm --filter @prodivix/web test:ci

      - name: Type check web
        run: pnpm --filter @prodivix/web typecheck

  canonical-cross-locale:
    name: Canonical bytes under a hostile locale
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Canonical bytes, digests and cross-process identity must not move when
      # the host ICU locale does. Turkish is the classic adversary (dotless-i
      # case mapping, collation that reorders ASCII), so the byte-pinned golden
      # suites run again under tr_TR: any code path that regressed to a
      # locale-dependent API fails here byte-for-byte even if the syntax fence
      # in eslint.config.mjs never saw it.
      - name: Generate tr_TR locale
        run: |
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale

      - name: Canonical byte suites under tr_TR
        env:
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8
        run: |
          pnpm --filter @prodivix/shared test
          pnpm --filter @prodivix/workspace test
          pnpm --filter @prodivix/runtime-core test

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Test backend
        working-directory: apps/backend
        run: go test ./...
