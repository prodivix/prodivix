name: G3 Behavior and Verification Boundaries

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.env.example'
      - 'apps/backend/go.mod'
      - 'apps/backend/go.sum'
      - 'apps/backend/README.md'
      - 'apps/backend/internal/app/**'
      - 'apps/backend/internal/config/**'
      - 'apps/backend/internal/modules/verification/**'
      - 'apps/backend/internal/modules/workspace/**'
      - 'apps/backend/internal/platform/behaviorcontract/**'
      - 'apps/backend/internal/platform/database/**'
      - 'apps/backend/internal/platform/http/**'
      - 'apps/backend/internal/platform/verificationcontract/**'
      - 'apps/cli/**'
      - 'apps/docs/reference/diagnostics/**'
      - 'apps/web/package.json'
      - 'apps/web/tsconfig.json'
      - 'apps/web/src/editor/features/development/reactflow/**'
      - 'apps/web/src/editor/features/execution/**'
      - 'apps/web/src/editor/features/resources/**'
      - 'apps/web/src/editor/features/verification/**'
      - 'apps/web/src/editor/store/**'
      - 'apps/web/src/i18n/resources/**'
      - 'packages/authoring/**'
      - 'packages/animation/**'
      - 'packages/behavior/**'
      - 'packages/data/**'
      - 'packages/diagnostics/**'
      - 'packages/golden-conformance/**'
      - 'packages/nodegraph/**'
      - 'packages/pir/**'
      - 'packages/prodivix-compiler/**'
      - 'packages/router/**'
      - 'packages/runtime-browser/**'
      - 'packages/runtime-core/**'
      - 'packages/runtime-remote/**'
      - 'packages/runtime-vitest/**'
      - 'packages/shared/**'
      - 'packages/verification/**'
      - 'packages/workspace/**'
      - 'packages/workspace-sync/**'
      - 'scripts/check-core-package-boundaries.mjs'
      - 'scripts/check-g3-*.mjs'
      - 'scripts/g3-verification-canonical-vector.mjs'
      - 'scripts/sync-g3-wire-contracts.mjs'
      - 'scripts/verify-g3-evidence-postgres.mjs'
      - 'specs/api/workspace-sync.openapi.yaml'
      - 'specs/diagnostics/**'
      - 'specs/decisions/58.verification-evidence-provenance-and-retention.md'
      - 'specs/implementation/g3-*.md'
      - 'specs/roadmap/current-status.md'
      - 'specs/roadmap/g3-*.md'
      - 'specs/workspace/workspace-model.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/g3-boundaries.yml'
  push:
    branches:
      - main
    paths:
      - '.env.example'
      - 'apps/backend/go.mod'
      - 'apps/backend/go.sum'
      - 'apps/backend/README.md'
      - 'apps/backend/internal/app/**'
      - 'apps/backend/internal/config/**'
      - 'apps/backend/internal/modules/verification/**'
      - 'apps/backend/internal/modules/workspace/**'
      - 'apps/backend/internal/platform/behaviorcontract/**'
      - 'apps/backend/internal/platform/database/**'
      - 'apps/backend/internal/platform/http/**'
      - 'apps/backend/internal/platform/verificationcontract/**'
      - 'apps/cli/**'
      - 'apps/docs/reference/diagnostics/**'
      - 'apps/web/package.json'
      - 'apps/web/tsconfig.json'
      - 'apps/web/src/editor/features/development/reactflow/**'
      - 'apps/web/src/editor/features/execution/**'
      - 'apps/web/src/editor/features/resources/**'
      - 'apps/web/src/editor/features/verification/**'
      - 'apps/web/src/editor/store/**'
      - 'apps/web/src/i18n/resources/**'
      - 'packages/authoring/**'
      - 'packages/animation/**'
      - 'packages/behavior/**'
      - 'packages/data/**'
      - 'packages/diagnostics/**'
      - 'packages/golden-conformance/**'
      - 'packages/nodegraph/**'
      - 'packages/pir/**'
      - 'packages/prodivix-compiler/**'
      - 'packages/router/**'
      - 'packages/runtime-browser/**'
      - 'packages/runtime-core/**'
      - 'packages/runtime-remote/**'
      - 'packages/runtime-vitest/**'
      - 'packages/shared/**'
      - 'packages/verification/**'
      - 'packages/workspace/**'
      - 'packages/workspace-sync/**'
      - 'scripts/check-core-package-boundaries.mjs'
      - 'scripts/check-g3-*.mjs'
      - 'scripts/g3-verification-canonical-vector.mjs'
      - 'scripts/sync-g3-wire-contracts.mjs'
      - 'scripts/verify-g3-evidence-postgres.mjs'
      - 'specs/api/workspace-sync.openapi.yaml'
      - 'specs/diagnostics/**'
      - 'specs/decisions/58.verification-evidence-provenance-and-retention.md'
      - 'specs/implementation/g3-*.md'
      - 'specs/roadmap/current-status.md'
      - 'specs/roadmap/g3-*.md'
      - 'specs/workspace/workspace-model.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/g3-boundaries.yml'

concurrency:
  group: g3-boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundaries:
    name: Behavior, Verification, Workspace, and Backend Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify G3 owner and wire boundaries
        run: pnpm run verify:g3:boundaries

  scenario-authoring:
    name: Scenario authoring and React/Vue semantic Golden Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Scenario authoring, semantic lowering, and target parity
        env:
          E2E_BROWSER_CHANNEL: chrome
        run: pnpm run verify:g3:scenario-authoring

  behavior-composition:
    name: V2 cross-domain Behavior and React/Vue Golden Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify owner-backed Route, NodeGraph, and Animation composition
        run: pnpm run verify:g3:behavior-composition

  deterministic-replay:
    name: V3 deterministic replay and provider conformance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify controls, isolation, ReplayRecord, and React/Vue replay
        env:
          E2E_BROWSER_CHANNEL: chrome
        run: pnpm run verify:g3:deterministic-replay

  verification-plan:
    name: V4 semantic Impact, Policy, Plan, and explain parity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Impact, Policy, deterministic DAG, Closure, and Web/CLI parity
        run: pnpm run verify:g3:verification-plan

  evidence:
    name: V5 Evidence promotion, provenance, PostgreSQL retention, and Closure Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prodivix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prodivix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRODIVIX_BACKEND_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/prodivix_test?sslmode=disable
      # Deterministic test-only 32-byte key; deployments must inject independent secret material.
      BACKEND_VERIFICATION_RESUME_KEY: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Evidence promotion, trust, retention, recovery, and Closure
        run: pnpm run verify:g3:evidence
