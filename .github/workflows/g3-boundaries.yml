      - 'packages/nodegraph/**'
      - 'packages/pir/**'
      - 'packages/plugin-antd/**'
      - 'packages/plugin-contracts/**'
      - 'packages/plugin-host/**'
      - 'packages/plugin-package/**'
      - 'packages/plugin-react-host/**'
