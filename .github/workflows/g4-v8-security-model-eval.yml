name: G4 V8 Security and Model Evaluation Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g4-v8-security-model-eval.yml'
      - 'apps/backend/go.mod'
      - 'apps/backend/go.sum'
      - 'apps/backend/internal/modules/agent/**'
      - 'apps/backend/internal/platform/agentcontract/**'
      - 'apps/backend/internal/platform/canonicaljson/**'
      - 'apps/backend/internal/platform/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/ai/**'
      - 'packages/golden-conformance/**'
      - 'packages/shared/**'
      - 'scripts/check-core-package-boundaries.mjs'
      - 'scripts/check-g4-boundaries.mjs'
      - 'scripts/g4-agent-evaluation-canonical-vector.mjs'
      - 'scripts/sync-g4-wire-contracts.mjs'
      - 'scripts/verify-g4-model-eval-evidence.mjs'
      - 'scripts/verify-g4-model-eval-postgres.mjs'
      - 'specs/decisions/66.model-provider-capability-and-invocation.md'
      - 'specs/decisions/69.real-model-evaluation-and-release-qualification.md'
      - 'specs/implementation/g4-verified-agentic-development.md'
      - 'specs/roadmap/current-status.md'
      - 'specs/roadmap/g4-closure-evidence.md'
      - 'specs/roadmap/g4-verified-agentic-development-milestones.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/g4-v8-security-model-eval.yml'
      - 'apps/backend/go.mod'
      - 'apps/backend/go.sum'
      - 'apps/backend/internal/modules/agent/**'
      - 'apps/backend/internal/platform/agentcontract/**'
      - 'apps/backend/internal/platform/canonicaljson/**'
      - 'apps/backend/internal/platform/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/ai/**'
      - 'packages/golden-conformance/**'
      - 'packages/shared/**'
      - 'scripts/check-core-package-boundaries.mjs'
      - 'scripts/check-g4-boundaries.mjs'
      - 'scripts/g4-agent-evaluation-canonical-vector.mjs'
      - 'scripts/sync-g4-wire-contracts.mjs'
      - 'scripts/verify-g4-model-eval-evidence.mjs'
      - 'scripts/verify-g4-model-eval-postgres.mjs'
      - 'specs/decisions/66.model-provider-capability-and-invocation.md'
      - 'specs/decisions/69.real-model-evaluation-and-release-qualification.md'
      - 'specs/implementation/g4-verified-agentic-development.md'
      - 'specs/roadmap/current-status.md'
      - 'specs/roadmap/g4-closure-evidence.md'
      - 'specs/roadmap/g4-verified-agentic-development-milestones.md'

concurrency:
  group: g4-v8-security-model-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-contract:
    name: Zero-remote-token security evaluation contract and PostgreSQL Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prodivix_g4_v8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prodivix_g4_v8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRODIVIX_BACKEND_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/prodivix_g4_v8?sslmode=disable
      PRODIVIX_G4_REMOTE_MODEL_UNITS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify deterministic security matrix
        run: pnpm run verify:g4:security
      - name: Verify model-evaluation contract and denominator ledger
        run: pnpm run verify:g4:model-eval:contract
      - name: Verify real PostgreSQL evaluation ledger
        run: pnpm run verify:g4:model-eval:postgres
