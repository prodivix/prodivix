            const stateVaultKey = Buffer.from(encodedStateVaultKey, 'base64')
            try {
              if (
                !/^[A-Za-z0-9+/]{43}=$/u.test(encodedProbeSpoolKey) ||
                probeSpoolKey.byteLength !== 32 ||
                probeSpoolKey.toString('base64') !== encodedProbeSpoolKey ||
                !/^[A-Za-z0-9+/]{43}=$/u.test(encodedStateVaultKey) ||
                stateVaultKey.byteLength !== 32 ||
                stateVaultKey.toString('base64') !== encodedStateVaultKey ||
                stateVaultKey.equals(probeSpoolKey)
              ) {
                throw new Error('The preplan authority keys must be independent exact 32-byte canonical base64 values')
              }
              authorityKeyVariants.push(probeSpoolKey.toString('base64url'), probeSpoolKey.toString('hex'), stateVaultKey.toString('base64url'), stateVaultKey.toString('hex'))
            } finally {
              probeSpoolKey.fill(0)
              stateVaultKey.fill(0)
            }
          }
          const protectedValues = [process.env.MASK_OPENAI, process.env.MASK_ANTHROPIC, process.env.MASK_GEMINI, process.env.MASK_SERVICE_TOKEN, process.env.MASK_OWNER_AUTHORITY_TOKEN, process.env.MASK_DATABASE_URL, ...(encodedProbeSpoolKey ? [encodedProbeSpoolKey, encodedStateVaultKey] : []), ...canaries]
          for (const value of protectedValues) {
            if (!value) throw new Error('A required protected evaluation service secret is missing')
            needles.push(value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('base64url'), Buffer.from(value).toString('hex'), encodeURIComponent(value))
          }
          needles.push(...authorityKeyVariants)
          const visit = (entry) => {
            for (const child of fs.readdirSync(entry, { withFileTypes: true })) {
              const target = path.join(entry, child.name)
              if (child.isDirectory()) visit(target)
              else {
                const bytes = fs.readFileSync(target)
                for (const needle of needles) if (bytes.includes(Buffer.from(needle))) throw new Error(`Service secret found in ${child.name}`)
              }
            }
          }
          visit(process.env.ARTIFACT_DIR)
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Upload frozen plan
        id: upload_plan
        if: steps.plan_safety.outputs.safe == 'true' && steps.plan_authority.outputs.reused != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.plan_authority.outputs.value }}
          path: ${{ runner.temp }}/g4-real-model-plan
          if-no-files-found: error
          retention-days: 14
      - name: Record plan artifact digest
        id: artifact_authority
        shell: bash
        env:
          CREATED_ARTIFACT_DIGEST: ${{ steps.upload_plan.outputs['artifact-digest'] }}
          REUSED_ARTIFACT_DIGEST: ${{ steps.plan_authority.outputs.digest }}
          ARTIFACT_NAME: ${{ steps.plan_authority.outputs.value }}
          PRODUCER_ATTEMPT: ${{ steps.plan_authority.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          artifact_digest="${CREATED_ARTIFACT_DIGEST:-${REUSED_ARTIFACT_DIGEST}}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${artifact_digest}"
          fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${artifact_digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Frozen G4 real-model plan'
            echo "- artifact: \`${ARTIFACT_NAME}\`"
            echo "- artifact SHA-256: \`${artifact_digest}\`"
            echo "- producer run attempt: \`${PRODUCER_ATTEMPT}\`"
            echo '- status: Configured / Evidence pending'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Seal generated run-config artifact authority
        if: steps.plan_authority.outputs.reused != 'true'
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ steps.plan_authority.outputs.value }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ steps.artifact_authority.outputs.digest }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ steps.plan_authority.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          node apps/agent-evaluation-runner/dist/cli.js \
            seal-run-config-artifact \
            --config "${GENERATED_CONFIG}" \
            --plan "${PLAN_PATH}"
      - name: Resolve same-run immutable frozen config commitment authority
        id: frozen_commitment_authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
          EVALUATION_ID: ${{ needs.preflight.outputs.evaluation_id }}
          PLAN_PRODUCER_ATTEMPT: ${{ steps.plan_authority.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          [[ "${PLAN_PRODUCER_ATTEMPT}" =~ ^[1-9][0-9]{0,8}$ ]]
          artifact_name="g4-real-model-frozen-config-commitment-${EXACT_COMMIT}-${EVALUATION_ID}-${PLAN_PRODUCER_ATTEMPT}"
          artifact_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          artifact_count="$(jq -er --arg name "${artifact_name}" '[.[]?.artifacts[]? | select(.name == $name)] | length' <<< "${artifact_pages}")"
          if (( artifact_count > 1 )); then
            echo '::error::The same-run frozen config commitment artifact identity is ambiguous.'
            exit 1
          fi
          artifact_digest=''
          reused=false
          if (( artifact_count == 1 )); then
            artifact="$(jq -cer --arg name "${artifact_name}" '[.[]?.artifacts[]? | select(.name == $name)][0]' <<< "${artifact_pages}")"
            if [[ "$(jq -er '.expired | tostring' <<< "${artifact}")" != 'false' ]]; then
              echo '::error::The same-run frozen config commitment artifact is expired.'
              exit 1
            fi
            artifact_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<< "${artifact}")"
            reused=true
          fi
          {
            echo "value=${artifact_name}"
            echo "digest=${artifact_digest}"
            echo "reused=${reused}"
          } >> "${GITHUB_OUTPUT}"
      - name: Download prior-attempt same-run frozen config commitment
        if: steps.frozen_commitment_authority.outputs.reused == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          name: ${{ steps.frozen_commitment_authority.outputs.value }}
          path: ${{ runner.temp }}/g4-real-model-frozen-config-commitment
      - name: Sign immutable frozen config commitment
        if: steps.frozen_commitment_authority.outputs.reused != 'true'
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PRODIVIX_G4_MODEL_EVAL_FROZEN_CONFIG_COMMITMENT_PATH: ${{ runner.temp }}/g4-real-model-frozen-config-commitment/frozen-config-commitment.json
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ steps.plan_authority.outputs.value }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ steps.artifact_authority.outputs.digest }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ steps.plan_authority.outputs.producer_attempt }}
          PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY }}
          PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID }}
          PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID }}
          PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          PRODIVIX_G4_MODEL_EVAL_WORKFLOW_NAME: g4-real-model-evaluation
          PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ID: ${{ github.run_id }}
          PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODIVIX_G4_MODEL_EVAL_JOB_ID: full_shards
          PRODIVIX_G4_MODEL_EVAL_WORKFLOW_JOB_ID: full_shards
          PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${PRODIVIX_G4_MODEL_EVAL_FROZEN_CONFIG_COMMITMENT_PATH}")"
          node apps/agent-evaluation-runner/dist/cli.js \
            freeze-config-commitment \
            --plan "${PLAN_PATH}" \
            --output "${PRODIVIX_G4_MODEL_EVAL_FROZEN_CONFIG_COMMITMENT_PATH}"
      - name: Admit and scan immutable frozen config commitment
        id: frozen_commitment_safety
        shell: bash
        env:
          COMMITMENT_ROOT: ${{ runner.temp }}/g4-real-model-frozen-config-commitment
          MASK_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = fs.realpathSync(process.env.COMMITMENT_ROOT)
          const names = fs.readdirSync(root)
          if (names.length !== 1 || names[0] !== 'frozen-config-commitment.json') {
            throw new Error('The frozen config commitment artifact must contain exactly one authority file')
          }
          const target = path.join(root, names[0])
          const stat = fs.lstatSync(target)
          if (!stat.isFile() || stat.isSymbolicLink() || fs.realpathSync(target) !== target || stat.size < 2 || stat.size > 1_048_576) {
            throw new Error('The frozen config commitment authority file is not bounded and concrete')
          }
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            const values = JSON.parse(process.env[name] ?? '')
            if (!Array.isArray(values) || values.length < 1 || values.length > 256) throw new Error(`${name} is invalid`)
            canaries.push(...values)
          }
          const protectedValues = [process.env.MASK_ATTESTATION_KEY, ...canaries]
          if (protectedValues.some((value) => typeof value !== 'string' || value.length < 1)) {
            throw new Error('A protected frozen commitment value is missing')
          }
          const bytes = fs.readFileSync(target)
          for (const value of protectedValues) {
            for (const variant of new Set([value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('base64url'), Buffer.from(value).toString('hex'), encodeURIComponent(value)])) {
              process.stdout.write(`::add-mask::${variant}\n`)
              if (bytes.includes(Buffer.from(variant))) throw new Error('The frozen config commitment contains protected material')
            }
          }
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Upload immutable frozen config commitment
        id: upload_frozen_commitment
        if: steps.frozen_commitment_safety.outputs.safe == 'true' && steps.frozen_commitment_authority.outputs.reused != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.frozen_commitment_authority.outputs.value }}
          path: ${{ runner.temp }}/g4-real-model-frozen-config-commitment/frozen-config-commitment.json
          if-no-files-found: error
          retention-days: 14
      - name: Record frozen config commitment artifact digest
        id: frozen_commitment_artifact
        shell: bash
        env:
          CREATED_ARTIFACT_DIGEST: ${{ steps.upload_frozen_commitment.outputs['artifact-digest'] }}
          REUSED_ARTIFACT_DIGEST: ${{ steps.frozen_commitment_authority.outputs.digest }}
        run: |
          set -euo pipefail
          artifact_digest="${CREATED_ARTIFACT_DIGEST:-${REUSED_ARTIFACT_DIGEST}}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then artifact_digest="sha256:${artifact_digest}"; fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${artifact_digest}" >> "${GITHUB_OUTPUT}"
      - name: Stop PID-bound preplan owner authority
        if: always()
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          OWNER_AUTHORITY_PID_FILE: ${{ runner.temp }}/g4-model-eval-preplan-owner-authority.pid
          OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH: ${{ runner.temp }}/g4-model-eval-preplan-owner-authority-state/shutdown-receipt.json
          EXPECTED_CAPABILITY_PROBE_DIGEST: ${{ steps.preplan_owner_authority.outputs.capability_probe_digest }}
          EXPECTED_CAPABILITY_PROBE_PROVIDER_RESOURCE_DIGEST: ${{ steps.preplan_owner_authority.outputs.capability_probe_provider_resource_digest }}
          EXPECTED_CAPABILITY_PROBE_PROVIDER_RESOURCE_CLEANUP_DIGEST: ${{ steps.preplan_owner_authority.outputs.capability_probe_provider_resource_cleanup_digest }}
          EXPECTED_REPLAY_JOURNAL_DIGEST: ${{ steps.preplan_owner_authority.outputs.replay_journal_digest }}
          EXPECTED_RUNTIME_FACT_SOURCE_REGISTRATION_DIGEST: ${{ steps.preplan_owner_authority.outputs.runtime_fact_source_registration_digest }}
          EXPECTED_STARTUP_HEALTH_DIGEST: ${{ steps.preplan_owner_authority.outputs.startup_health_digest }}
        run: |
          set -uo pipefail
          cleanup_failed=0
          owned_pid=false
          if [[ -e "${OWNER_AUTHORITY_PID_FILE}" ]]; then
            owned_pid=true
            if [[ -L "${OWNER_AUTHORITY_PID_FILE}" || ! -f "${OWNER_AUTHORITY_PID_FILE}" || "$(stat -c '%a' "${OWNER_AUTHORITY_PID_FILE}" 2>/dev/null || true)" != '600' ]]; then
              echo '::error::Preplan owner authority PID authority is invalid.'
              cleanup_failed=1
            else
              owner_authority_pid=''
              IFS= read -r owner_authority_pid < "${OWNER_AUTHORITY_PID_FILE}" || true
              if ! [[ "${owner_authority_pid}" =~ ^[1-9][0-9]*$ ]]; then
                echo '::error::Preplan owner authority PID is not numeric.'
                cleanup_failed=1
              elif kill -0 "${owner_authority_pid}" 2>/dev/null; then
                process_identity_matches() {
                  local current_executable current_command
                  current_executable="$(readlink -f -- "/proc/${owner_authority_pid}/exe" 2>/dev/null || true)"
                  current_command="$(tr '\0' ' ' < "/proc/${owner_authority_pid}/cmdline" 2>/dev/null || true)"
                  [[ "${current_executable}" == "$(readlink -f -- "$(command -v node)" 2>/dev/null || true)" && "${current_command}" == *'apps/agent-evaluation-runner/dist/productionOwnerAuthoritySidecarMain.js'* ]]
                }
                if ! process_identity_matches; then
                  echo '::error::Preplan owner authority PID belongs to an unexpected process.'
                  cleanup_failed=1
                else
                  kill -TERM "${owner_authority_pid}" 2>/dev/null || true
                  for _ in $(seq 1 120); do
                    if ! kill -0 "${owner_authority_pid}" 2>/dev/null; then break; fi
                    sleep 1
                  done
                  if kill -0 "${owner_authority_pid}" 2>/dev/null; then
                    if ! process_identity_matches; then
                      echo '::error::Preplan owner authority PID identity changed during shutdown.'
                      cleanup_failed=1
                    else
                      kill -KILL "${owner_authority_pid}" 2>/dev/null || true
                      for _ in $(seq 1 5); do
                        if ! kill -0 "${owner_authority_pid}" 2>/dev/null; then break; fi
                        sleep 1
                      done
                      if kill -0 "${owner_authority_pid}" 2>/dev/null; then
                        echo '::error::Preplan owner authority remained alive after bounded shutdown; preserving PID authority for diagnosis.'
                        cleanup_failed=1
                      fi
                    fi
                  fi
                fi
              fi
            fi
          fi

          if [[ "${cleanup_failed}" == '0' && "${owned_pid}" == 'true' ]]; then
            if [[ ! -f "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" || -L "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" || "$(stat -c '%a' "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" 2>/dev/null || true)" != '600' ]]; then
              echo '::error::Preplan owner authority canonical shutdown receipt is unavailable.'
              cleanup_failed=1
            elif pnpm exec tsx scripts/verify-g4-evaluation-owner-lifecycle.mjs shutdown-receipt preplan >/dev/null
            then
              rm -f -- "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}"
            else
              echo '::error::Preplan owner authority shutdown receipt drifted or retained residuals.'
              cleanup_failed=1
            fi
          elif [[ -e "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" ]]; then
            echo '::error::Preplan owner authority shutdown receipt exists without an owned PID.'
            cleanup_failed=1
          fi
          if [[ "${cleanup_failed}" == '0' ]]; then rm -f -- "${OWNER_AUTHORITY_PID_FILE}"; fi
          exit "${cleanup_failed}"
      - name: Verify or recover plan state-vault zero-residual terminus
        if: always() && steps.plan_authority.outputs.reused != 'true'
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-plan
          LEDGER_LOG: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-plan-recovery.log
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-plan.pid
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_LEDGER_LISTEN_ADDRESS: 127.0.0.1:8790
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_OWNER_INSTANCE_ID: ${{ github.run_id }}.${{ github.run_attempt }}.plan
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_RECOVERY_ONLY: '1'
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_OWNER_INSTANCE_ID: ${{ github.run_id }}.${{ github.run_attempt }}.plan.provider-journal
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL: ''
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ''
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_PURPOSE: ''
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ''
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ''
          PRODIVIX_G4_MODEL_EVAL_PUBLIC_RESPONSE_CANARIES_BASE64URL: ''
          PRODIVIX_G4_MODEL_EVAL_PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -L "${LEDGER_PID_FILE}" || ( -e "${LEDGER_PID_FILE}" && ( ! -f "${LEDGER_PID_FILE}" || "$(stat -c '%a' "${LEDGER_PID_FILE}" 2>/dev/null || true)" != '600' ) ) ]]; then
            echo '::error::Plan evaluation ledger PID authority is invalid before state-vault closure.'
            exit 1
          fi
          if [[ ! -f "${LEDGER_BINARY}" || -L "${LEDGER_BINARY}" || ! -x "${LEDGER_BINARY}" ]]; then
            echo '::error::Plan evaluation ledger executable authority is unavailable for state-vault closure.'
            exit 1
          fi
          expected_executable="$(readlink -f -- "${LEDGER_BINARY}" 2>/dev/null || true)"
          if [[ -z "${expected_executable}" ]]; then
            echo '::error::Plan evaluation ledger executable identity is unavailable for state-vault closure.'
            exit 1
          fi
          ledger_pid=''
          if [[ -f "${LEDGER_PID_FILE}" ]]; then
            IFS= read -r ledger_pid < "${LEDGER_PID_FILE}"
            if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::Plan evaluation ledger PID authority is not numeric before state-vault closure.'
              exit 1
            fi
            process_identity_matches() {
              local current_executable current_command
              current_executable="$(readlink -f -- "/proc/${ledger_pid}/exe" 2>/dev/null || true)"
              current_command="$(tr '\0' ' ' < "/proc/${ledger_pid}/cmdline" 2>/dev/null || true)"
              [[ "${current_executable}" == "${expected_executable}" && "${current_command}" == *"${LEDGER_BINARY}"* ]]
            }
            if kill -0 "${ledger_pid}" 2>/dev/null; then
              if ! process_identity_matches; then
                if kill -0 "${ledger_pid}" 2>/dev/null; then
                  echo '::error::Plan evaluation ledger PID belongs to an unexpected process before state-vault closure.'
                  exit 1
                fi
              else
                journal_health_digest="$(pnpm exec tsx scripts/verify-g4-capability-effect-provider-journal-lifecycle.mjs health 15000)"
                echo "- plan capability-effect Provider journal clean health: \`${journal_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
                state_vault_health_digest="$(pnpm exec tsx scripts/verify-g4-native-provider-state-vault-health.mjs zero 130000)"
                echo "- plan state-vault zero-residual health: \`${state_vault_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
                exit 0
              fi
            fi
          fi
          rm -f -- "${LEDGER_PID_FILE}"
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Plan state-vault recovery loopback port 8790 is already occupied.'
            exit 1
          fi
          "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
          ledger_pid=$!
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${ledger_pid}" > "${LEDGER_PID_FILE}"); then
            kill -TERM "${ledger_pid}" 2>/dev/null || true
            wait "${ledger_pid}" 2>/dev/null || true
            echo '::error::Plan state-vault recovery PID could not be recorded exclusively.'
            exit 1
          fi
          chmod 0600 "${LEDGER_PID_FILE}"
          journal_health_digest="$(pnpm exec tsx scripts/verify-g4-capability-effect-provider-journal-lifecycle.mjs health 15000)"
          echo "- plan recovery capability-effect Provider journal clean health: \`${journal_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
          state_vault_recovery_digest="$(pnpm exec tsx scripts/verify-g4-native-provider-state-vault-recovery.mjs recover 130000)"
          echo "- plan state-vault crash-recovery zero-residual receipt: \`${state_vault_recovery_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop PID-bound evaluation ledger
        if: always()
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-plan
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-plan.pid
        run: |
          set -uo pipefail
          if [[ ! -e "${LEDGER_PID_FILE}" ]]; then exit 0; fi
          if [[ -L "${LEDGER_PID_FILE}" || ! -f "${LEDGER_PID_FILE}" || "$(stat -c '%a' "${LEDGER_PID_FILE}" 2>/dev/null || true)" != '600' ]]; then
            echo '::error::Evaluation ledger PID authority is invalid.'
            exit 1
          fi
          ledger_pid=''
          IFS= read -r ledger_pid < "${LEDGER_PID_FILE}" || true
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Evaluation ledger PID authority is not numeric.'
            exit 1
          fi
          if kill -0 "${ledger_pid}" 2>/dev/null; then
            if [[ ! -f "${LEDGER_BINARY}" || -L "${LEDGER_BINARY}" || ! -x "${LEDGER_BINARY}" ]]; then
              echo '::error::Evaluation ledger executable authority is unavailable.'
              exit 1
            fi
            expected_executable="$(readlink -f -- "${LEDGER_BINARY}" 2>/dev/null || true)"
            process_identity_matches() {
              local current_executable current_command
              current_executable="$(readlink -f -- "/proc/${ledger_pid}/exe" 2>/dev/null || true)"
              current_command="$(tr '\0' ' ' < "/proc/${ledger_pid}/cmdline" 2>/dev/null || true)"
              [[ -n "${expected_executable}" && "${current_executable}" == "${expected_executable}" && "${current_command}" == *"${LEDGER_BINARY}"* ]]
            }
            if ! process_identity_matches; then
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                echo '::error::Evaluation ledger PID belongs to an unexpected process.'
                exit 1
              fi
            else
              kill -TERM "${ledger_pid}" 2>/dev/null || true
              for _ in $(seq 1 60); do
                if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                if ! process_identity_matches; then
                  echo '::error::Evaluation ledger PID identity changed during shutdown.'
                  exit 1
                fi
                kill -KILL "${ledger_pid}" 2>/dev/null || true
                for _ in $(seq 1 5); do
                  if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                  sleep 1
                done
                if kill -0 "${ledger_pid}" 2>/dev/null; then
                  echo '::error::Evaluation ledger remained alive after bounded shutdown.'
                  exit 1
                fi
              fi
            fi
          fi
          rm -f -- "${LEDGER_PID_FILE}"

  smoke:
    name: Bounded five-endpoint admission smoke
    if: needs.preflight.outputs.mode == 'evaluate'
    needs:
      - preflight
      - plan
    runs-on: [self-hosted, linux, x64, g4-real-model-evaluation]
    timeout-minutes: 30
    environment: g4-real-model-evaluation
    permissions:
      contents: read
    env:
      PRODIVIX_G4_MODEL_EVAL_ENABLED: '1'
      PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL: http://127.0.0.1:8790
      PRODIVIX_G4_MODEL_EVAL_OPENAI_MODEL_ID: ${{ needs.preflight.outputs.openai_model_id }}
      PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_MODEL_ID: ${{ needs.preflight.outputs.anthropic_model_id }}
      PRODIVIX_G4_MODEL_EVAL_GEMINI_MODEL_ID: ${{ needs.preflight.outputs.gemini_model_id }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
      PRODIVIX_G4_MODEL_EVAL_NAMESPACE: ${{ needs.preflight.outputs.evaluation_namespace }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ needs.plan.outputs.plan_artifact_name }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ needs.plan.outputs.plan_artifact_run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_MAX_COST_USD: ${{ needs.preflight.outputs.max_cost_usd }}
      PRODIVIX_G4_MODEL_EVAL_MAX_LOGICAL_TOKENS: ${{ needs.preflight.outputs.max_logical_tokens }}
      PRODIVIX_G4_MODEL_EVAL_MAX_ELAPSED_MINUTES: ${{ needs.preflight.outputs.max_elapsed_minutes }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.repository_commit }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Set up Go for the Backend ledger
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Download same-run frozen plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Admit same-run generated production config
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = fs.realpathSync(process.env.PLAN_ARTIFACT_ROOT)
          const target = process.env.GENERATED_CONFIG
          const stat = fs.lstatSync(target)
          const displacement = path.relative(root, fs.realpathSync(target))
          if (!stat.isFile() || stat.isSymbolicLink() || displacement === '..' || displacement.startsWith(`..${path.sep}`) || path.isAbsolute(displacement) || stat.size < 2 || stat.size > 16_777_216) {
            throw new Error('The generated production config is not one bounded regular artifact file')
          }
          NODE
          echo "PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH=${GENERATED_CONFIG}" >> "${GITHUB_ENV}"
      - name: Build exact Backend evaluation ledger
        shell: bash
        env:
          GOPROXY: 'off'
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-smoke
        run: |
          set -euo pipefail
          test ! -e "${LEDGER_BINARY}"
          (
            cd apps/backend
            go build -trimpath -o "${LEDGER_BINARY}" ./cmd/agent-evaluation-ledger
          )
          test -f "${LEDGER_BINARY}"
          test ! -L "${LEDGER_BINARY}"
          test -x "${LEDGER_BINARY}"
      - name: Register provider-secret masks
        shell: bash
        env:
          MASK_OPENAI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          MASK_ANTHROPIC: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          MASK_GEMINI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          MASK_HOSTED_COMPATIBLE: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_COMPATIBLE_API_KEY }}
          MASK_LOCAL_COMPATIBLE: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_LOCAL_COMPATIBLE_API_KEY }}
          MASK_RESULT_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
        run: |
          node <<'NODE'
          const serviceToken = process.env.MASK_SERVICE_TOKEN ?? ''
          const serviceTokenBytes = Buffer.byteLength(serviceToken, 'utf8')
          if (
            serviceTokenBytes < 32 ||
            serviceTokenBytes > 4_096 ||
            !/^[A-Za-z0-9._~+\/-]+={0,2}$/u.test(serviceToken)
          ) {
            throw new Error('The evaluation service token must be 32..4096 canonical ASCII bytes')
          }
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          for (const value of [process.env.MASK_OPENAI, process.env.MASK_ANTHROPIC, process.env.MASK_GEMINI, process.env.MASK_HOSTED_COMPATIBLE, process.env.MASK_LOCAL_COMPATIBLE, process.env.MASK_RESULT_SPOOL_KEY, process.env.MASK_SERVICE_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]) {
            if (!value) throw new Error('A required provider credential is missing')
            const variants = [value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value)]
            for (const variant of new Set(variants)) process.stdout.write(`::add-mask::${variant}\n`)
          }
          NODE
      - name: Start Backend-owned evaluation ledger
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_LEDGER_LISTEN_ADDRESS: 127.0.0.1:8790
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          LEDGER_LOG: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-smoke.log
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-smoke.pid
        run: |
          set -euo pipefail
          if curl --fail --silent --max-time 1 "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz" >/dev/null 2>&1; then
            echo '::error::A pre-existing evaluation ledger health endpoint is reachable.'
            exit 1
          fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Evaluation ledger loopback port 8790 is already occupied.'
            exit 1
          fi
          "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
          ledger_pid=$!
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${ledger_pid}" > "${LEDGER_PID_FILE}"); then
            kill -TERM "${ledger_pid}" 2>/dev/null || true
            wait "${ledger_pid}" 2>/dev/null || true
            echo '::error::Evaluation ledger PID could not be recorded exclusively.'
            exit 1
          fi
          chmod 0600 "${LEDGER_PID_FILE}"
          for _ in $(seq 1 60); do
            if ! kill -0 "${ledger_pid}" 2>/dev/null; then
              echo '::error::Evaluation ledger exited before readiness.'
              exit 1
            fi
            health_status=''
            if health_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz")" && test "${health_status}" = '204'; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Evaluation ledger did not become healthy.'
          exit 1
      - name: Run bounded native and OpenAI-compatible endpoint smoke
        id: endpoint_smoke
        shell: bash
        env:
          RUN_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_COMPATIBLE_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_COMPATIBLE_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_LOCAL_COMPATIBLE_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_LOCAL_COMPATIBLE_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_SMOKE_RECEIPT_PATH: ${{ runner.temp }}/g4-real-model-smoke/smoke-receipts.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${PRODIVIX_G4_MODEL_EVAL_SMOKE_RECEIPT_PATH}")"
          node apps/agent-evaluation-runner/dist/cli.js \
            smoke \
            --config "${RUN_CONFIG}" \
            --plan "${PLAN_PATH}" \
            --output "${PRODIVIX_G4_MODEL_EVAL_SMOKE_RECEIPT_PATH}"
      - name: Scan smoke artifact for credential values
        id: smoke_safety
        if: always()
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/g4-real-model-smoke
          MASK_OPENAI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          MASK_ANTHROPIC: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          MASK_GEMINI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          MASK_HOSTED_COMPATIBLE: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_COMPATIBLE_API_KEY }}
          MASK_LOCAL_COMPATIBLE: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_LOCAL_COMPATIBLE_API_KEY }}
          MASK_RESULT_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -d "${ARTIFACT_DIR}"
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const needles = []
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          for (const value of [process.env.MASK_OPENAI, process.env.MASK_ANTHROPIC, process.env.MASK_GEMINI, process.env.MASK_HOSTED_COMPATIBLE, process.env.MASK_LOCAL_COMPATIBLE, process.env.MASK_RESULT_SPOOL_KEY, process.env.MASK_SERVICE_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]) {
            if (!value) throw new Error('A required provider credential is missing')
            needles.push(value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value))
          }
          const visit = (entry) => {
            for (const child of fs.readdirSync(entry, { withFileTypes: true })) {
              const target = path.join(entry, child.name)
              if (child.isDirectory()) visit(target)
              else {
                const bytes = fs.readFileSync(target)
                for (const needle of needles) {
                  if (bytes.includes(Buffer.from(needle))) throw new Error(`Credential material found in ${child.name}`)
                }
              }
            }
          }
          visit(process.env.ARTIFACT_DIR)
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Upload bounded smoke receipts
        id: upload_smoke
        if: always() && steps.smoke_safety.outputs.safe == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g4-real-model-smoke-${{ needs.preflight.outputs.repository_commit }}-${{ needs.preflight.outputs.evaluation_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g4-real-model-smoke
          if-no-files-found: error
          retention-days: 14
      - name: Record bounded-smoke boundary
        if: always() && steps.upload_smoke.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_smoke.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          artifact_digest="${ARTIFACT_DIGEST}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${artifact_digest}"
          fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Bounded provider smoke'
            echo "- artifact SHA-256: \`${artifact_digest}\`"
            echo '- scope: three native transports plus hosted/local OpenAI-compatible admission, bounded streams, response identity, and exact terminal markers'
            echo '- qualification: adapter admission only; G4 remains Evidence pending'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop PID-bound evaluation ledger
        if: always()
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-smoke.pid
        run: |
          set -uo pipefail
          if [[ ! -e "${LEDGER_PID_FILE}" ]]; then exit 0; fi
          if [[ -L "${LEDGER_PID_FILE}" || ! -f "${LEDGER_PID_FILE}" || "$(stat -c '%a' "${LEDGER_PID_FILE}" 2>/dev/null || true)" != '600' ]]; then
            echo '::error::Evaluation ledger PID authority is invalid.'
            exit 1
          fi
          ledger_pid=''
          IFS= read -r ledger_pid < "${LEDGER_PID_FILE}" || true
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Evaluation ledger PID authority is not numeric.'
            exit 1
          fi
          if kill -0 "${ledger_pid}" 2>/dev/null; then
            if [[ ! -f "${LEDGER_BINARY}" || -L "${LEDGER_BINARY}" || ! -x "${LEDGER_BINARY}" ]]; then
              echo '::error::Evaluation ledger executable authority is unavailable.'
              exit 1
            fi
            expected_executable="$(readlink -f -- "${LEDGER_BINARY}" 2>/dev/null || true)"
            process_identity_matches() {
              local current_executable current_command
              current_executable="$(readlink -f -- "/proc/${ledger_pid}/exe" 2>/dev/null || true)"
              current_command="$(tr '\0' ' ' < "/proc/${ledger_pid}/cmdline" 2>/dev/null || true)"
              [[ -n "${expected_executable}" && "${current_executable}" == "${expected_executable}" && "${current_command}" == *"${LEDGER_BINARY}"* ]]
            }
            if ! process_identity_matches; then
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                echo '::error::Evaluation ledger PID belongs to an unexpected process.'
                exit 1
              fi
            else
              kill -TERM "${ledger_pid}" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                if ! process_identity_matches; then
                  echo '::error::Evaluation ledger PID identity changed during shutdown.'
                  exit 1
                fi
                kill -KILL "${ledger_pid}" 2>/dev/null || true
                for _ in $(seq 1 5); do
                  if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                  sleep 1
                done
                if kill -0 "${ledger_pid}" 2>/dev/null; then
                  echo '::error::Evaluation ledger remained alive after bounded shutdown.'
                  exit 1
                fi
              fi
            fi
          fi
          rm -f -- "${LEDGER_PID_FILE}"

  hosted_prepare:
    name: Prepare singleton Hosted retrieval runtime resources
    if: >-
      needs.preflight.outputs.mode == 'evaluate' &&
      needs.preflight.outputs.suite == 'full'
    needs:
      - preflight
      - plan
      - smoke
    runs-on: [self-hosted, linux, x64, g4-real-model-evaluation]
    timeout-minutes: 45
    environment: g4-real-model-evaluation
    permissions:
      contents: read
    outputs:
      prepared_artifact_name: ${{ steps.prepared_artifact.outputs.name }}
    env:
      PRODIVIX_G4_MODEL_EVAL_ENABLED: '1'
      PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL: http://127.0.0.1:8790
      PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL: http://127.0.0.1:8791
      PRODIVIX_G4_MODEL_EVAL_NAMESPACE: ${{ needs.preflight.outputs.evaluation_namespace }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_ROOT: ${{ github.workspace }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ needs.plan.outputs.plan_artifact_name }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ needs.plan.outputs.plan_artifact_run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_NAME: g4-real-model-evaluation
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_JOB_ID: full_shards
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_JOB_ID: full_shards
      PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST }}
      PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_ROLE: prepare
      PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_OWNER_INSTANCE_ID: g4.hosted-lifecycle.${{ github.run_id }}.${{ github.run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_FROZEN_CONFIG_COMMITMENT_PATH: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/frozen-config-commitment.json
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.repository_commit }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Set up Go for the Backend ledger
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Download same-run frozen plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Download same-run signed frozen config commitment
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.frozen_config_commitment_artifact_name }}
          path: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare
      - name: Admit same-run generated production config
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = fs.realpathSync(process.env.PLAN_ARTIFACT_ROOT)
          const target = process.env.GENERATED_CONFIG
          const stat = fs.lstatSync(target)
          const displacement = path.relative(root, fs.realpathSync(target))
          if (!stat.isFile() || stat.isSymbolicLink() || displacement === '..' || displacement.startsWith(`..${path.sep}`) || path.isAbsolute(displacement) || stat.size < 2 || stat.size > 16_777_216) {
            throw new Error('The generated production config is not one bounded regular artifact file')
          }
          NODE
          echo "PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH=${GENERATED_CONFIG}" >> "${GITHUB_ENV}"
      - name: Build exact Backend evaluation ledger
        shell: bash
        env:
          GOPROXY: 'off'
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-hosted-prepare
        run: |
          set -euo pipefail
          test ! -e "${LEDGER_BINARY}"
          (
            cd apps/backend
            go build -trimpath -o "${LEDGER_BINARY}" ./cmd/agent-evaluation-ledger
          )
          test -f "${LEDGER_BINARY}"
          test ! -L "${LEDGER_BINARY}"
          test -x "${LEDGER_BINARY}"
      - name: Register lifecycle secret masks and verify physical key isolation
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs mask
      - name: Start Backend-owned evaluation ledger
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_LEDGER_LISTEN_ADDRESS: 127.0.0.1:8790
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-hosted-prepare
          LEDGER_LOG: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/ledger.log
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/ledger.pid
        run: |
          set -euo pipefail
          if curl --fail --silent --max-time 1 "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz" >/dev/null 2>&1; then
            echo '::error::A pre-existing evaluation ledger health endpoint is reachable.'
            exit 1
          fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Evaluation ledger loopback port 8790 is already occupied.'
            exit 1
          fi
          mkdir -p "$(dirname "${LEDGER_LOG}")"
          "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
          ledger_pid=$!
          (set -o noclobber; printf '%s\n' "${ledger_pid}" > "${LEDGER_PID_FILE}")
          chmod 0600 "${LEDGER_PID_FILE}"
          for _ in $(seq 1 60); do
            kill -0 "${ledger_pid}" 2>/dev/null || { echo '::error::Evaluation ledger exited before readiness.'; exit 1; }
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz" || true)"
            if [[ "${status}" = '204' ]]; then exit 0; fi
            sleep 1
          done
          echo '::error::Evaluation ledger did not become healthy.'
          exit 1
      - name: Start independent Hosted lifecycle Provider listener
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_STATE_DIRECTORY: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/state
          LIFECYCLE_LOG: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/listener.log
          LIFECYCLE_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/listener.pid
        run: |
          set -euo pipefail
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8791,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Hosted lifecycle listener loopback port 8791 is already occupied.'
            exit 1
          fi
          mkdir -p "${PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_STATE_DIRECTORY}"
          node apps/agent-evaluation-runner/dist/productionHostedRetrievalRuntimeResourceLifecycleSidecarMain.js > "${LIFECYCLE_LOG}" 2>&1 &
          lifecycle_pid=$!
          (set -o noclobber; printf '%s\n' "${lifecycle_pid}" > "${LIFECYCLE_PID_FILE}")
          chmod 0600 "${LIFECYCLE_PID_FILE}"
          if ! lifecycle_health_digest="$(pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs ready 60000)"; then
            kill -0 "${lifecycle_pid}" 2>/dev/null || echo '::error::Hosted lifecycle listener exited before readiness.'
            echo '::error::Hosted lifecycle listener did not return authenticated canonical readiness.'
            exit 1
          fi
          kill -0 "${lifecycle_pid}" 2>/dev/null || { echo '::error::Hosted lifecycle listener exited after readiness.'; exit 1; }
          echo "- Hosted lifecycle prepare health: \`${lifecycle_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
      - name: Prepare exact Hosted runtime resource set once
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_STATE_DIRECTORY: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/state
          PREPARED_SET_PATH: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/hosted-runtime-resource-prepared.json
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs prepare --output "${PREPARED_SET_PATH}"
      - name: Stop PID-bound Hosted lifecycle authorities
        if: always()
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-hosted-prepare
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/ledger.pid
          LIFECYCLE_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/listener.pid
        run: |
          set -euo pipefail
          stop_process() {
            local pid_file="$1" expected="$2"
            [[ -f "${pid_file}" ]] || return 0
            local pid
            pid="$(cat "${pid_file}")"
            [[ "${pid}" =~ ^[1-9][0-9]*$ ]] || return 1
            if kill -0 "${pid}" 2>/dev/null; then
              tr '\0' ' ' < "/proc/${pid}/cmdline" | grep -F -- "${expected}" >/dev/null
              kill -TERM "${pid}"
              for _ in $(seq 1 60); do kill -0 "${pid}" 2>/dev/null || break; sleep 1; done
              if kill -0 "${pid}" 2>/dev/null; then kill -KILL "${pid}"; fi
            fi
            rm -f -- "${pid_file}"
          }
          stop_process "${LIFECYCLE_PID_FILE}" 'productionHostedRetrievalRuntimeResourceLifecycleSidecarMain.js'
          stop_process "${LEDGER_PID_FILE}" "${LEDGER_BINARY}"
      - name: Scan Hosted prepare artifacts for secrets and canaries
        if: always()
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          SCAN_ROOT: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare
        run: |
          set -euo pipefail
          mkdir -p "${SCAN_ROOT}"
          pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs scan "${SCAN_ROOT}"
      - name: Resolve prepared artifact identity
        id: prepared_artifact
        shell: bash
        env:
          EXACT_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
          EVALUATION_ID: ${{ needs.preflight.outputs.evaluation_id }}
        run: echo "name=g4-hosted-runtime-resource-prepared-${EXACT_COMMIT}-${EVALUATION_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - name: Upload singleton Hosted prepared set
        uses: actions/upload-artifact@330a01c4904f88e0873c5ce6a9cfe768ee69e85a # v7
        with:
          name: ${{ steps.prepared_artifact.outputs.name }}
          path: ${{ runner.temp }}/g4-hosted-runtime-resource-prepare/hosted-runtime-resource-prepared.json
          if-no-files-found: error
          retention-days: 14

  full_shards:
    name: Full frozen shard (${{ matrix.shard }})
    if: needs.preflight.outputs.mode == 'evaluate' && needs.preflight.outputs.suite == 'full'
    needs:
      - preflight
      - plan
      - smoke
      - hosted_prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_matrix) }}
    runs-on: [self-hosted, linux, x64, g4-real-model-evaluation]
    timeout-minutes: 360
    environment: g4-real-model-evaluation
    permissions:
      contents: read
    env:
      PRODIVIX_G4_MODEL_EVAL_ENABLED: '1'
      PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL: http://127.0.0.1:8790
      PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL: http://127.0.0.1:8791
      PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_BASE_URL: http://127.0.0.1:8792
      PRODIVIX_G4_MODEL_EVAL_NAMESPACE: ${{ needs.preflight.outputs.evaluation_namespace }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_ROOT: ${{ github.workspace }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ needs.plan.outputs.plan_artifact_name }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ needs.plan.outputs.plan_artifact_run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_NAME: g4-real-model-evaluation
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_JOB_ID: full_shards
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_JOB_ID: full_shards
      PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST }}
      PRODIVIX_G4_MODEL_EVAL_OPENAI_MODEL_ID: ${{ needs.preflight.outputs.openai_model_id }}
      PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_MODEL_ID: ${{ needs.preflight.outputs.anthropic_model_id }}
      PRODIVIX_G4_MODEL_EVAL_GEMINI_MODEL_ID: ${{ needs.preflight.outputs.gemini_model_id }}
      PRODIVIX_G4_MODEL_EVAL_HOLDOUT_DIRECTORY: ${{ vars.PRODIVIX_G4_MODEL_EVAL_HOLDOUT_DIRECTORY }}
      PRODIVIX_G4_MODEL_EVAL_MAX_COST_USD: ${{ needs.preflight.outputs.max_cost_usd }}
      PRODIVIX_G4_MODEL_EVAL_MAX_LOGICAL_TOKENS: ${{ needs.preflight.outputs.max_logical_tokens }}
      PRODIVIX_G4_MODEL_EVAL_MAX_ELAPSED_MINUTES: ${{ needs.preflight.outputs.max_elapsed_minutes }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.repository_commit }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Download same-run frozen plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Download same-run signed frozen config commitment
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.frozen_config_commitment_artifact_name }}
          path: ${{ runner.temp }}
      - name: Admit same-run generated production config
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = fs.realpathSync(process.env.PLAN_ARTIFACT_ROOT)
          const target = process.env.GENERATED_CONFIG
          const stat = fs.lstatSync(target)
          const displacement = path.relative(root, fs.realpathSync(target))
          if (!stat.isFile() || stat.isSymbolicLink() || displacement === '..' || displacement.startsWith(`..${path.sep}`) || path.isAbsolute(displacement) || stat.size < 2 || stat.size > 16_777_216) {
            throw new Error('The generated production config is not one bounded regular artifact file')
          }
          NODE
          echo "PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH=${GENERATED_CONFIG}" >> "${GITHUB_ENV}"
      - name: Set up Go for the Backend ledger
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Build exact Backend evaluation ledger
        shell: bash
        env:
          GOPROXY: 'off'
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          VERIFICATION_BINARY: ${{ runner.temp }}/g4-verification-owner-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: |
          set -euo pipefail
          test ! -e "${LEDGER_BINARY}"
          test ! -e "${VERIFICATION_BINARY}"
          (
            cd apps/backend
            go build -trimpath -o "${LEDGER_BINARY}" ./cmd/agent-evaluation-ledger
            go build -trimpath -o "${VERIFICATION_BINARY}" ./cmd/server
          )
          for binary in "${LEDGER_BINARY}" "${VERIFICATION_BINARY}"; do
            test -f "${binary}"
            test ! -L "${binary}"
            test -x "${binary}"
          done
      - name: Register transport and service-secret masks
        id: g3_verification_authority
        shell: bash
        env:
          MASK_OPENAI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          MASK_ANTHROPIC: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          MASK_GEMINI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          MASK_HOLDOUT_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOLDOUT_KEY_BASE64 }}
          MASK_RESULT_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          MASK_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64 }}
          MASK_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          MASK_NATIVE_PROVIDER_STATE_VAULT_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          MASK_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          MASK_G3_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_PRIVATE_KEY_PKCS8_BASE64URL }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_OWNER_AUTHORITY_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          MASK_VERIFICATION_OWNER_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_TOKEN }}
          MASK_VERIFICATION_RESUME_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_RESUME_KEY_BASE64 }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          G3_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_KEY_ID }}
          G3_ATTESTATION_ISSUER: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_ISSUER }}
          G3_ATTESTATION_AUDIENCE: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_AUDIENCE }}
          G3_ATTESTATION_SUBJECT: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_SUBJECT }}
          G3_ATTESTATION_TRUST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_TRUST }}
          G3_ATTESTATION_POLICY_GENERATION: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_POLICY_GENERATION }}
          G3_ATTESTATION_MAXIMUM_LIFETIME_MS: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_MAXIMUM_LIFETIME_MS }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs')
          const { createPrivateKey, createPublicKey } = require('node:crypto')
          const serviceToken = process.env.MASK_SERVICE_TOKEN ?? ''
          const ownerAuthorityToken = process.env.MASK_OWNER_AUTHORITY_TOKEN ?? ''
          const verificationOwnerToken = process.env.MASK_VERIFICATION_OWNER_TOKEN ?? ''
          for (const [name, value] of [
            ['evaluation service token', serviceToken],
            ['owner authority service token', ownerAuthorityToken],
            ['Verification owner token', verificationOwnerToken],
          ]) {
            const byteLength = Buffer.byteLength(value, 'utf8')
            if (
              byteLength < 32 ||
              byteLength > 4_096 ||
              !/^[A-Za-z0-9._~+\/-]+={0,2}$/u.test(value)
            ) {
              throw new Error(`The ${name} must be 32..4096 canonical ASCII bytes`)
            }
          }
          if (ownerAuthorityToken === serviceToken) throw new Error('The loopback authority tokens must be independently scoped')
          if (verificationOwnerToken === serviceToken || verificationOwnerToken === ownerAuthorityToken) throw new Error('The Verification owner token must be independently scoped')
          const decodeCanonicalAes256Key = (name, encoded) => {
            const key = Buffer.from(encoded ?? '', 'base64')
            if (!/^[A-Za-z0-9+/]{43}=$/u.test(encoded ?? '') || key.byteLength !== 32 || key.toString('base64') !== encoded) {
              key.fill(0)
              throw new Error(`The ${name} must be exactly 32 canonical base64-decoded bytes`)
            }
            return key
          }
          const resultSpoolKey = decodeCanonicalAes256Key('result-spool key', process.env.MASK_RESULT_SPOOL_KEY)
          const capabilityProbeResponseSpoolKey = decodeCanonicalAes256Key('capability-probe response spool key', process.env.MASK_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY)
          const capabilityEffectProviderJournalSpoolKey = decodeCanonicalAes256Key('capability-effect Provider journal spool key', process.env.MASK_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY)
          const nativeProviderStateVaultKey = decodeCanonicalAes256Key('native Provider state-vault key', process.env.MASK_NATIVE_PROVIDER_STATE_VAULT_KEY)
          const verificationResumeKey = decodeCanonicalAes256Key('Verification resume key', process.env.MASK_VERIFICATION_RESUME_KEY)
          const decodeCanonicalEd25519Pkcs8Key = (name, encoded) => {
            const key = Buffer.from(encoded ?? '', 'base64url')
            if (!/^[A-Za-z0-9_-]{64}$/u.test(encoded ?? '') || key.byteLength !== 48 || key.toString('base64url') !== encoded || key.subarray(0, 16).toString('hex') !== '302e020100300506032b657004220420') {
              key.fill(0)
              throw new Error(`The ${name} must be one canonical 48-byte Ed25519 PKCS8 key`)
            }
            return key
          }
          const modelEvaluationAttestationKey = decodeCanonicalEd25519Pkcs8Key('model-evaluation attestation key', process.env.MASK_ATTESTATION_KEY)
          const g3AttestationKey = decodeCanonicalEd25519Pkcs8Key('G3 evidence attestation key', process.env.MASK_G3_ATTESTATION_KEY)
          try {
            if (nativeProviderStateVaultKey.equals(resultSpoolKey)) throw new Error('The native Provider state-vault key must be physically independent from the result-spool key')
            if ([resultSpoolKey, capabilityProbeResponseSpoolKey, nativeProviderStateVaultKey].some((key) => capabilityEffectProviderJournalSpoolKey.equals(key))) throw new Error('The capability-effect Provider journal spool key must be physically independent from result, probe, and state-vault keys')
            if (verificationResumeKey.equals(resultSpoolKey) || verificationResumeKey.equals(nativeProviderStateVaultKey)) throw new Error('The Verification resume key must be physically independent from spool and state-vault keys')
            if (g3AttestationKey.equals(modelEvaluationAttestationKey)) throw new Error('The G3 evidence attestation key must be physically independent from the model-evaluation archive key')
            for (const variant of [nativeProviderStateVaultKey.toString('base64url'), nativeProviderStateVaultKey.toString('hex')]) process.stdout.write(`::add-mask::${variant}\n`)
            for (const variant of [capabilityEffectProviderJournalSpoolKey.toString('base64url'), capabilityEffectProviderJournalSpoolKey.toString('hex')]) process.stdout.write(`::add-mask::${variant}\n`)
            for (const variant of [verificationResumeKey.toString('base64url'), verificationResumeKey.toString('hex')]) process.stdout.write(`::add-mask::${variant}\n`)
            for (const key of [modelEvaluationAttestationKey, g3AttestationKey]) {
              for (const variant of [key.toString('base64'), key.toString('base64url'), key.toString('hex')]) process.stdout.write(`::add-mask::${variant}\n`)
            }
            const keyId = process.env.G3_ATTESTATION_KEY_ID ?? ''
            const issuer = process.env.G3_ATTESTATION_ISSUER ?? ''
            const audience = process.env.G3_ATTESTATION_AUDIENCE ?? ''
            const subject = process.env.G3_ATTESTATION_SUBJECT ?? ''
            const trust = process.env.G3_ATTESTATION_TRUST ?? ''
            const policyGeneration = process.env.G3_ATTESTATION_POLICY_GENERATION ?? ''
            const maximumLifetimeMs = process.env.G3_ATTESTATION_MAXIMUM_LIFETIME_MS ?? ''
            const identity = /^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,511}$/u
            if (!/^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$/u.test(keyId) || ![issuer, audience, subject].every((value) => identity.test(value)) || !['remote-attested', 'ci-attested'].includes(trust) || !/^[1-9][0-9]{0,6}$/u.test(policyGeneration) || Number(policyGeneration) > 1_000_000 || !/^[1-9][0-9]{0,6}$/u.test(maximumLifetimeMs) || Number(maximumLifetimeMs) > 3_600_000) {
              throw new Error('The G3 public attestation policy is invalid')
            }
            const privateKey = createPrivateKey({ key: g3AttestationKey, format: 'der', type: 'pkcs8' })
            const publicKeyDer = createPublicKey(privateKey).export({ format: 'der', type: 'spki' })
            if (!Buffer.isBuffer(publicKeyDer) || publicKeyDer.byteLength !== 44 || publicKeyDer.subarray(0, 12).toString('hex') !== '302a300506032b6570032100') throw new Error('The derived G3 Ed25519 public key is invalid')
            const publicKey = publicKeyDer.subarray(12).toString('base64')
            const attestationKeys = JSON.stringify({ [keyId]: { publicKey, issuer, audience, subject, trust } })
            appendFileSync(process.env.GITHUB_OUTPUT, `attestation_keys=${attestationKeys}\npolicy_generation=${policyGeneration}\nmaximum_lifetime=${maximumLifetimeMs}ms\n`, { encoding: 'utf8' })
          } finally {
            resultSpoolKey.fill(0)
            capabilityProbeResponseSpoolKey.fill(0)
            capabilityEffectProviderJournalSpoolKey.fill(0)
            nativeProviderStateVaultKey.fill(0)
            verificationResumeKey.fill(0)
            modelEvaluationAttestationKey.fill(0)
            g3AttestationKey.fill(0)
          }
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          const values = [process.env.MASK_OPENAI, process.env.MASK_ANTHROPIC, process.env.MASK_GEMINI, process.env.MASK_HOLDOUT_KEY, process.env.MASK_RESULT_SPOOL_KEY, process.env.MASK_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY, process.env.MASK_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY, process.env.MASK_NATIVE_PROVIDER_STATE_VAULT_KEY, process.env.MASK_VERIFICATION_RESUME_KEY, process.env.MASK_ATTESTATION_KEY, process.env.MASK_G3_ATTESTATION_KEY, process.env.MASK_SERVICE_TOKEN, process.env.MASK_OWNER_AUTHORITY_TOKEN, process.env.MASK_VERIFICATION_OWNER_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]
          for (const value of values) {
            if (!value) throw new Error('A required protected evaluation secret is missing')
            const variants = [value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('base64url'), Buffer.from(value).toString('hex'), encodeURIComponent(value)]
            for (const variant of new Set(variants)) process.stdout.write(`::add-mask::${variant}\n`)
          }
          NODE
      - name: Start independent Backend Verification owner
        shell: bash
        env:
          APP_ENV: test
          BACKEND_ADDR: 127.0.0.1:8792
          BACKEND_DB_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          BACKEND_VERIFICATION_ARTIFACT_ROOT: ${{ runner.temp }}/g4-model-eval-verification-${{ matrix.shard }}
          BACKEND_VERIFICATION_RESUME_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_RESUME_KEY_BASE64 }}
          BACKEND_VERIFICATION_AGENT_EVALUATION_OWNER_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_TOKEN }}
          BACKEND_VERIFICATION_ATTESTATION_KEYS: ${{ steps.g3_verification_authority.outputs.attestation_keys }}
          BACKEND_VERIFICATION_ATTESTATION_POLICY_GENERATION: ${{ steps.g3_verification_authority.outputs.policy_generation }}
          BACKEND_VERIFICATION_ATTESTATION_MAX_LIFETIME: ${{ steps.g3_verification_authority.outputs.maximum_lifetime }}
          BACKEND_VERIFICATION_SECRET_CANARIES_JSON: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          BACKEND_VERIFICATION_PROTECTED_CANARIES_JSON: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          VERIFICATION_BINARY: ${{ runner.temp }}/g4-verification-owner-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          VERIFICATION_LOG: ${{ runner.temp }}/g4-verification-owner.log
          VERIFICATION_PID_FILE: ${{ runner.temp }}/g4-verification-owner.pid
        run: |
          set -euo pipefail
          mkdir -p "${BACKEND_VERIFICATION_ARTIFACT_ROOT}"
          chmod 0700 "${BACKEND_VERIFICATION_ARTIFACT_ROOT}"
          BACKEND_VERIFICATION_SECRET_CANARIES="$(node <<'NODE'
          const values = []
          for (const name of ['BACKEND_VERIFICATION_SECRET_CANARIES_JSON', 'BACKEND_VERIFICATION_PROTECTED_CANARIES_JSON']) {
            const source = JSON.parse(process.env[name] ?? '')
            if (!Array.isArray(source) || source.length === 0 || source.some((value) => typeof value !== 'string' || value.includes(','))) throw new Error(`${name} must be a non-empty comma-safe string array`)
            values.push(...source)
          }
          process.stdout.write([...new Set(values)].join(','))
          NODE
          )"
          export BACKEND_VERIFICATION_SECRET_CANARIES
          if curl --config - >/dev/null 2>&1 <<EOF
          url = "${PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_BASE_URL}/api/internal/verification/agent-evaluation-owner/v1/health"
          header = "Authorization: Bearer ${BACKEND_VERIFICATION_AGENT_EVALUATION_OWNER_TOKEN}"
          header = "X-Prodivix-Verification-Authority-Purpose: agent-evaluation-verification-owner"
          silent
          fail
          max-time = 1
          EOF
          then
            echo '::error::A pre-existing Backend Verification owner health endpoint is reachable.'
            exit 1
          fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8792,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Backend Verification owner loopback port 8792 is already occupied.'
            exit 1
          fi
          "${VERIFICATION_BINARY}" > "${VERIFICATION_LOG}" 2>&1 &
          verification_pid=$!
          if ! [[ "${verification_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${verification_pid}" > "${VERIFICATION_PID_FILE}"); then
            kill -TERM "${verification_pid}" 2>/dev/null || true
            wait "${verification_pid}" 2>/dev/null || true
            echo '::error::Backend Verification owner PID could not be recorded exclusively.'
            exit 1
          fi
          chmod 0600 "${VERIFICATION_PID_FILE}"
          for _ in $(seq 1 60); do
            if ! kill -0 "${verification_pid}" 2>/dev/null; then
              echo '::error::Backend Verification owner exited before readiness.'
              exit 1
            fi
            health_body=''
            if health_body="$(curl --config - <<EOF
          url = "${PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_BASE_URL}/api/internal/verification/agent-evaluation-owner/v1/health"
          header = "Authorization: Bearer ${BACKEND_VERIFICATION_AGENT_EVALUATION_OWNER_TOKEN}"
          header = "X-Prodivix-Verification-Authority-Purpose: agent-evaluation-verification-owner"
          silent
          show-error
          fail
          max-time = 3
          EOF
            )" && HEALTH_BODY="${health_body}" node <<'NODE'
          const raw = process.env.HEALTH_BODY ?? ''
          let value
          try { value = JSON.parse(raw) } catch { process.exit(1) }
          const expectedKeys = ['format', 'version', 'purpose', 'implementationDigest']
          if (!value || Array.isArray(value) || Object.keys(value).length !== expectedKeys.length || expectedKeys.some((key) => !Object.hasOwn(value, key)) || value.format !== 'prodivix.verification-agent-evaluation-owner-health' || value.version !== 1 || value.purpose !== 'agent-evaluation-verification-owner' || value.implementationDigest !== 'sha256-dd90cc626e7b1ea7d0ccc65a93ca01759654242a75579297db7cacda7a8a79e7') process.exit(1)
          NODE
            then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Backend Verification owner did not become healthy.'
          exit 1
      - name: Start Backend-owned evaluation ledger bootstrap
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
