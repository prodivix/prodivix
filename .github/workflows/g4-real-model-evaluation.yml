          fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Evaluation ledger loopback port 8790 is already occupied.'
            exit 1
          fi
          "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
          ledger_pid=$!
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${ledger_pid}" > "${LEDGER_PID_FILE}"); then
            kill -TERM "${ledger_pid}" 2>/dev/null || true
            wait "${ledger_pid}" 2>/dev/null || true
            echo '::error::Evaluation ledger PID could not be recorded exclusively.'
            exit 1
          fi
          chmod 0600 "${LEDGER_PID_FILE}"
          for _ in $(seq 1 60); do
            if ! kill -0 "${ledger_pid}" 2>/dev/null; then
              echo '::error::Evaluation ledger exited before readiness.'
              exit 1
            fi
            health_status=''
            if health_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz")" && test "${health_status}" = '204'; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Evaluation ledger did not become healthy.'
          exit 1
      - name: Verify source runs target the same exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
          EVALUATION_RUN_ID: ${{ needs.preflight.outputs.source_evaluation_run_id }}
          EVALUATION_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_evaluation_run_attempt }}
          PLAN_ARTIFACT_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_plan_run_attempt }}
          REVIEW_RUN_ID: ${{ needs.preflight.outputs.source_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_review_run_attempt }}
          DETERMINISTIC_RUN_ID: ${{ needs.preflight.outputs.deterministic_run_id }}
          DETERMINISTIC_RUN_ATTEMPT: ${{ needs.preflight.outputs.deterministic_run_attempt }}
          PLAN_ARTIFACT_NAME: ${{ needs.preflight.outputs.source_plan_artifact_name }}
          PLAN_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.source_plan_artifact_digest }}
          REVIEW_ARTIFACT_NAME: ${{ needs.preflight.outputs.review_artifact_name }}
          REVIEW_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.review_artifact_digest }}
          DETERMINISTIC_ARTIFACT_NAME: ${{ needs.preflight.outputs.deterministic_artifact_name }}
          DETERMINISTIC_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.deterministic_artifact_digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const source = fs.readFileSync('.github/workflows/g4-real-model-human-review.yml', 'utf8')
          const required = [
            '  publish:\n',
            '    runs-on: [self-hosted, linux, x64, g4-real-model-human-review]\n',
            '    environment: g4-real-model-human-review\n',
            '      - name: Upload project-attested human review\n',
          ]
          if (required.some((fragment) => !source.includes(fragment))) {
            throw new Error('The exact-commit human-review workflow contract is unavailable')
          }
          NODE
          evaluation_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVALUATION_RUN_ID}")"
          review_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}")"
          deterministic_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DETERMINISTIC_RUN_ID}")"
          jq -e --arg commit "${EXPECTED_COMMIT}" --arg repository "${GITHUB_REPOSITORY}" --argjson attempt "${EVALUATION_RUN_ATTEMPT}" \
            '.head_sha == $commit and .head_repository.full_name == $repository and .path == ".github/workflows/g4-real-model-evaluation.yml" and .run_attempt == $attempt and .status == "completed" and .conclusion == "success" and (.event == "workflow_dispatch" or .event == "schedule")' <<< "${evaluation_run}" >/dev/null
          (( PLAN_ARTIFACT_RUN_ATTEMPT <= EVALUATION_RUN_ATTEMPT ))
          [[ "${PLAN_ARTIFACT_NAME}" =~ ^g4-real-model-plan-${EXPECTED_COMMIT}-[a-zA-Z0-9][a-zA-Z0-9._-]{0,46}-${PLAN_ARTIFACT_RUN_ATTEMPT}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVALUATION_RUN_ID}/attempts/${PLAN_ARTIFACT_RUN_ATTEMPT}/jobs?per_page=100" | jq -e \
            '[.jobs[] |
              select(
                .name == "Freeze evaluation plan and shard schedule" and
                .status == "completed" and
                .conclusion == "success" and
                (.labels | index("self-hosted")) != null and
                (.labels | index("linux")) != null and
                (.labels | index("x64")) != null and
                (.labels | index("g4-real-model-evaluation")) != null
              )] | length == 1' >/dev/null
          jq -e --arg commit "${EXPECTED_COMMIT}" --arg repository "${GITHUB_REPOSITORY}" --argjson attempt "${REVIEW_RUN_ATTEMPT}" \
            '.head_sha == $commit and .head_repository.full_name == $repository and .path == ".github/workflows/g4-real-model-human-review.yml" and .run_attempt == $attempt and .status == "completed" and .conclusion == "success" and .event == "workflow_dispatch"' <<< "${review_run}" >/dev/null
          jq -e --arg commit "${EXPECTED_COMMIT}" --arg repository "${GITHUB_REPOSITORY}" --argjson attempt "${DETERMINISTIC_RUN_ATTEMPT}" \
            '.head_sha == $commit and .head_repository.full_name == $repository and .path == ".github/workflows/g4-v9-golden-closure.yml" and .run_attempt == $attempt and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")' <<< "${deterministic_run}" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}/attempts/${REVIEW_RUN_ATTEMPT}/jobs?per_page=100" | jq -e \
            '[.jobs[] |
              select(
                .name == "Validate and publish signed human review" and
                .status == "completed" and
                .conclusion == "success" and
                (.labels | index("self-hosted")) != null and
                (.labels | index("linux")) != null and
                (.labels | index("x64")) != null and
                (.labels | index("g4-real-model-human-review")) != null
              )] | length == 1' >/dev/null

          assert_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local artifact_digest="$3"
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq -e \
              --arg artifact_name "${artifact_name}" \
              --arg artifact_digest "${artifact_digest}" \
              '[.[]?.artifacts[]? | select(.name == $artifact_name and .expired == false and .digest == $artifact_digest)] | length == 1' >/dev/null
          }
          assert_artifact "${EVALUATION_RUN_ID}" "${PLAN_ARTIFACT_NAME}" "${PLAN_ARTIFACT_DIGEST}"
          assert_artifact "${REVIEW_RUN_ID}" "${REVIEW_ARTIFACT_NAME}" "${REVIEW_ARTIFACT_DIGEST}"
          assert_artifact "${DETERMINISTIC_RUN_ID}" "${DETERMINISTIC_ARTIFACT_NAME}" "${DETERMINISTIC_ARTIFACT_DIGEST}"
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Download source plan artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.source_evaluation_run_id }}
          name: ${{ needs.preflight.outputs.source_plan_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Admit and cross-bind source generated production config
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          PLAN_ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
          EXPECTED_PLAN_DIGEST: ${{ needs.preflight.outputs.source_plan_digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { lstatSync, readFileSync, realpathSync } from 'node:fs'
          import { isAbsolute, relative, sep } from 'node:path'
          import {
            decodeAgentEvaluationFrozenRunConfig,
            requireProductionAgentEvaluationFrozenRunConfig,
          } from './apps/agent-evaluation-runner/dist/index.js'

          const root = realpathSync(process.env.PLAN_ARTIFACT_ROOT)
          const target = process.env.GENERATED_CONFIG
          const stat = lstatSync(target)
          const displacement = relative(root, realpathSync(target))
          if (!stat.isFile() || stat.isSymbolicLink() || displacement === '..' || displacement.startsWith(`..${sep}`) || isAbsolute(displacement) || stat.size < 2 || stat.size > 16_777_216) {
            throw new Error('The generated production config is not one bounded regular artifact file')
          }
          const rawConfig = JSON.parse(readFileSync(target, 'utf8'))
          const plan = JSON.parse(readFileSync(process.env.PLAN_PATH, 'utf8'))
          const config = requireProductionAgentEvaluationFrozenRunConfig(
            decodeAgentEvaluationFrozenRunConfig(rawConfig, {
              clock: () => rawConfig.plannedAt,
              expectedRepositoryCommit: process.env.EXPECTED_COMMIT,
            }),
            process.env.EXPECTED_COMMIT,
          )
          const qualificationProbeCount = Object.values(
            config.qualificationAuthorityBundle.capabilityProbeAuthorities,
          ).reduce((count, authorities) => count + Object.keys(authorities).length, 0)
          const runtimeFactSourceCount = Object.values(
            config.qualificationAuthorityBundle.runtimeFactSourceAuthorities,
          ).reduce((count, authorities) => count + Object.keys(authorities).length, 0)
          const providerResourceCleanupReceiptCount = Object.values(
            config.qualificationAuthorityBundle.providerResourceCleanupReceipts,
          ).reduce((count, receipts) => count + Object.keys(receipts).length, 0)
          const probeProviderResourceAuthorityCount = Object.values(
            config.probeProviderResourceAuthorityBundle.authorities,
          ).reduce((count, authorities) => count + Object.keys(authorities).length, 0)
          const preplanAuthorityOperationCount =
            probeProviderResourceAuthorityCount +
            runtimeFactSourceCount +
            qualificationProbeCount +
            providerResourceCleanupReceiptCount
          if (
            config.plan.repositoryCommit !== process.env.EXPECTED_COMMIT ||
            config.plan.planDigest !== process.env.EXPECTED_PLAN_DIGEST ||
            config.plan.planDigest !== plan.planDigest ||
            config.plan.plannedAt !== plan.plannedAt ||
            config.plan.expiresAt !== plan.expiresAt ||
            config.plan.plannedJourneyCount !== 14_040 ||
            probeProviderResourceAuthorityCount !== 4 ||
            Object.hasOwn(
              config.probeProviderResourceAuthorityBundle.authorities,
              'anthropic-messages',
            ) ||
            qualificationProbeCount !== 18 ||
            runtimeFactSourceCount !== 15 ||
            providerResourceCleanupReceiptCount !== 4 ||
            preplanAuthorityOperationCount !== 41
          ) {
            throw new Error('The generated production config drifted from the exact source plan')
          }
          NODE
          echo "PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH=${GENERATED_CONFIG}" >> "${GITHUB_ENV}"
      - name: Download independent human-review artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.source_review_run_id }}
          name: ${{ needs.preflight.outputs.review_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-human-review
      - name: Download exact deterministic V9 Closure artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.deterministic_run_id }}
          name: ${{ needs.preflight.outputs.deterministic_artifact_name }}
          path: ${{ runner.temp }}/g4-deterministic-closure
      - name: Cross-bind plan and human-review digest
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          REVIEW_PATH: ${{ runner.temp }}/g4-real-model-human-review/human-review.json
          REVIEW_RUN_ID: ${{ needs.preflight.outputs.source_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_review_run_attempt }}
        run: |
          set -euo pipefail
          test -f "${PLAN_PATH}"
          test -f "${REVIEW_PATH}"
          test "$(find "$(dirname "${REVIEW_PATH}")" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$(dirname "${REVIEW_PATH}")" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          plan_digest="$(jq -er '.planDigest' "${PLAN_PATH}")"
          review_plan_digest="$(jq -er '.planDigest' "${REVIEW_PATH}")"
          test "${plan_digest}" = "${review_plan_digest}"
          jq -e \
            --arg run_id "${REVIEW_RUN_ID}" \
            --argjson run_attempt "${REVIEW_RUN_ATTEMPT}" \
            '.artifactAuthority.workflowName == "g4-real-model-human-review" and
             .artifactAuthority.workflowRunId == $run_id and
             .artifactAuthority.workflowRunAttempt == $run_attempt' \
            "${REVIEW_PATH}" >/dev/null
      - name: Cross-bind deterministic manifest to the trusted GitHub run
        shell: bash
        env:
          DETERMINISTIC_PATH: ${{ runner.temp }}/g4-deterministic-closure/prodivix-g4-v9-closure-manifest.json
          DETERMINISTIC_RUN_ID: ${{ needs.preflight.outputs.deterministic_run_id }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
        run: |
          set -euo pipefail
          test -f "${DETERMINISTIC_PATH}"
          jq -e \
            --arg commit "${EXPECTED_COMMIT}" \
            --arg run_id "${DETERMINISTIC_RUN_ID}" \
            '.wireVersion == 1 and .factType == "g4-golden-closure-manifest" and .value.repositoryCommit == $commit and .value.worktreeState == "clean" and .value.goldenVerdict == "satisfied" and .value.modelEvaluation.status == "pending" and (.value.deterministicGateEvidence | length == 11) and all(.value.deterministicGateEvidence[]; .repositoryCommit == $commit and .executionMode == "github-actions" and .runId == $run_id and .jobId == "deterministic-golden" and .status == "passed" and .remoteModelUnits == 0)' \
            "${DETERMINISTIC_PATH}" >/dev/null
      - name: Import role-separated human review
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          REVIEW_PATH: ${{ runner.temp }}/g4-real-model-human-review/human-review.json
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          node apps/agent-evaluation-runner/dist/cli.js \
            import-review \
            --plan "${PLAN_PATH}" \
            --input "${REVIEW_PATH}"
      - name: Finalize immutable evaluation manifest
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          FINAL_DIR: ${{ runner.temp }}/g4-real-model-final
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${FINAL_DIR}"
          node apps/agent-evaluation-runner/dist/cli.js \
            finalize \
            --plan "${PLAN_PATH}" \
            --output "${FINAL_DIR}/manifest.json"
      - name: Register attestation-secret masks
        shell: bash
        env:
          MASK_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          node <<'NODE'
          for (const value of [process.env.MASK_ATTESTATION_KEY, process.env.MASK_SERVICE_TOKEN, process.env.MASK_DATABASE_URL]) {
            if (!value) throw new Error('A required finalization secret is missing')
            const variants = [value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value)]
            for (const variant of new Set(variants)) process.stdout.write(`::add-mask::${variant}\n`)
          }
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            const values = JSON.parse(process.env[name] ?? '')
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            for (const value of values) {
              const variants = [value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value)]
              for (const variant of new Set(variants)) process.stdout.write(`::add-mask::${variant}\n`)
            }
          }
          NODE
      - name: Export project-signed sharded evidence archive
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          MANIFEST_PATH: ${{ runner.temp }}/g4-real-model-final/manifest.json
          EVIDENCE_ARCHIVE_PATH: ${{ runner.temp }}/g4-real-model-final/evidence-archive
          EVIDENCE_ROOT_PATH: ${{ runner.temp }}/g4-real-model-final/evidence-root.json
          PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          test -n "${PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY}"
          test -n "${PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID}"
          node apps/agent-evaluation-runner/dist/cli.js \
            export-evidence \
            --plan "${PLAN_PATH}" \
            --manifest "${MANIFEST_PATH}" \
            --archive-output "${EVIDENCE_ARCHIVE_PATH}" \
            --root-output "${EVIDENCE_ROOT_PATH}"
      - name: Scan final artifact for protected secret values
        id: final_safety
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/g4-real-model-final
          MASK_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const needles = []
          for (const value of [process.env.MASK_ATTESTATION_KEY, process.env.MASK_SERVICE_TOKEN, process.env.MASK_DATABASE_URL]) {
            if (!value) throw new Error('A required finalization secret is missing')
            needles.push(value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value))
          }
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            const values = JSON.parse(process.env[name] ?? '')
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            for (const value of values) needles.push(value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value))
          }
          const visit = (entry) => {
            for (const child of fs.readdirSync(entry, { withFileTypes: true })) {
              const target = path.join(entry, child.name)
              if (child.isDirectory()) visit(target)
              else {
                const bytes = fs.readFileSync(target)
                for (const needle of needles) {
                  if (bytes.includes(Buffer.from(needle))) throw new Error(`Secret material found in ${child.name}`)
                }
              }
            }
          }
          visit(process.env.ARTIFACT_DIR)
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Prepare external verifier trust root
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY}"
          test -n "${PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID}"
          trusted_keys="$(jq -cn \
            --arg keyId "${PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID}" \
            --arg publicKeyBase64Url "${PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY}" \
            '[{keyId: $keyId, publicKeyBase64Url: $publicKeyBase64Url}]')"
          echo "PRODIVIX_G4_MODEL_EVAL_TRUSTED_PUBLIC_KEYS=${trusted_keys}" >> "${GITHUB_ENV}"
      - name: Verify strict project-signed real-model evidence
        env:
          PRODIVIX_G4_MODEL_EVAL_EVIDENCE_ARCHIVE: ${{ runner.temp }}/g4-real-model-final/evidence-archive
          PRODIVIX_G4_MODEL_EVAL_EVIDENCE_ROOT: ${{ runner.temp }}/g4-real-model-final/evidence-root.json
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          PRODIVIX_G4_WORKTREE_STATE: clean
        run: pnpm run verify:g4:model-eval:evidence
      - name: Assemble and verify exact satisfied G4 Closure
        shell: bash
        env:
          PRODIVIX_G4_DETERMINISTIC_CLOSURE_EVIDENCE: ${{ runner.temp }}/g4-deterministic-closure/prodivix-g4-v9-closure-manifest.json
          PRODIVIX_G4_CLOSURE_EVIDENCE_OUTPUT: ${{ runner.temp }}/g4-real-model-final/g4-closure.json
          PRODIVIX_G4_GOLDEN_EVIDENCE: ${{ runner.temp }}/g4-real-model-final/g4-closure.json
          PRODIVIX_G4_MODEL_EVAL_EVIDENCE_ARCHIVE: ${{ runner.temp }}/g4-real-model-final/evidence-archive
          PRODIVIX_G4_MODEL_EVAL_EVIDENCE_ROOT: ${{ runner.temp }}/g4-real-model-final/evidence-root.json
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          PRODIVIX_G4_WORKTREE_STATE: clean
        run: |
          set -euo pipefail
          pnpm run assemble:g4:closure:evidence
          pnpm run verify:g4:golden:evidence
      - name: Scan assembled Closure artifact for protected values
        id: closure_safety
        shell: bash
        env:
          CLOSURE_PATH: ${{ runner.temp }}/g4-real-model-final/g4-closure.json
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          test -f "${CLOSURE_PATH}"
          node <<'NODE'
          const fs = require('node:fs')
          const bytes = fs.readFileSync(process.env.CLOSURE_PATH)
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            const values = JSON.parse(process.env[name] ?? '')
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            for (const value of values) {
              for (const needle of new Set([value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value)])) {
                if (bytes.includes(Buffer.from(needle))) throw new Error('Protected material found in assembled Closure')
              }
            }
          }
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Publish optional GitHub build provenance
        if: vars.PRODIVIX_G4_MODEL_EVAL_PUBLISH_GITHUB_ATTESTATION == '1'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ runner.temp }}/g4-real-model-final/evidence-archive/**
            ${{ runner.temp }}/g4-real-model-final/evidence-root.json
            ${{ runner.temp }}/g4-real-model-final/g4-closure.json
      - name: Upload signed evidence archive
        id: upload_evidence
        if: always() && steps.final_safety.outputs.safe == 'true' && steps.closure_safety.outputs.safe == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g4-real-model-evidence-${{ needs.preflight.outputs.repository_commit }}-${{ needs.preflight.outputs.evaluation_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g4-real-model-final
          if-no-files-found: error
          retention-days: 90
      - name: Record final artifact identity
        if: always() && steps.upload_evidence.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_evidence.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          artifact_digest="${ARTIFACT_DIGEST}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${artifact_digest}"
          fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Project-signed G4 real-model evidence and satisfied Closure'
            echo "- artifact SHA-256: \`${artifact_digest}\`"
            echo '- authority: project Ed25519 signature plus strict model-eval evidence verifier'
            echo '- promotion: this artifact records exact-commit deterministic, real-model, review, and Closure admission'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop PID-bound evaluation ledger
        if: always()
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-finalize
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-finalize.pid
        run: |
          set -uo pipefail
          if [[ ! -e "${LEDGER_PID_FILE}" ]]; then exit 0; fi
          if [[ -L "${LEDGER_PID_FILE}" || ! -f "${LEDGER_PID_FILE}" || "$(stat -c '%a' "${LEDGER_PID_FILE}" 2>/dev/null || true)" != '600' ]]; then
            echo '::error::Evaluation ledger PID authority is invalid.'
            exit 1
          fi
          ledger_pid=''
          IFS= read -r ledger_pid < "${LEDGER_PID_FILE}" || true
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Evaluation ledger PID authority is not numeric.'
            exit 1
          fi
          if kill -0 "${ledger_pid}" 2>/dev/null; then
            if [[ ! -f "${LEDGER_BINARY}" || -L "${LEDGER_BINARY}" || ! -x "${LEDGER_BINARY}" ]]; then
              echo '::error::Evaluation ledger executable authority is unavailable.'
              exit 1
            fi
            expected_executable="$(readlink -f -- "${LEDGER_BINARY}" 2>/dev/null || true)"
            process_identity_matches() {
              local current_executable current_command
              current_executable="$(readlink -f -- "/proc/${ledger_pid}/exe" 2>/dev/null || true)"
              current_command="$(tr '\0' ' ' < "/proc/${ledger_pid}/cmdline" 2>/dev/null || true)"
              [[ -n "${expected_executable}" && "${current_executable}" == "${expected_executable}" && "${current_command}" == *"${LEDGER_BINARY}"* ]]
            }
            if ! process_identity_matches; then
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                echo '::error::Evaluation ledger PID belongs to an unexpected process.'
                exit 1
              fi
            else
              kill -TERM "${ledger_pid}" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                if ! process_identity_matches; then
                  echo '::error::Evaluation ledger PID identity changed during shutdown.'
                  exit 1
                fi
                kill -KILL "${ledger_pid}" 2>/dev/null || true
                for _ in $(seq 1 5); do
                  if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                  sleep 1
                done
                if kill -0 "${ledger_pid}" 2>/dev/null; then
                  echo '::error::Evaluation ledger remained alive after bounded shutdown.'
                  exit 1
                fi
              fi
            fi
          fi
          rm -f -- "${LEDGER_PID_FILE}"
