      - name: Register preplan provider and service-secret masks
        shell: bash
        env:
          MASK_OPENAI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          MASK_ANTHROPIC: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          MASK_GEMINI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_OWNER_AUTHORITY_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          node <<'NODE'
          const serviceToken = process.env.MASK_SERVICE_TOKEN ?? ''
          const ownerAuthorityToken = process.env.MASK_OWNER_AUTHORITY_TOKEN ?? ''
          for (const [name, value] of [
            ['evaluation service token', serviceToken],
            ['owner authority service token', ownerAuthorityToken],
          ]) {
            const byteLength = Buffer.byteLength(value, 'utf8')
            if (
              byteLength < 32 ||
              byteLength > 4_096 ||
              !/^[A-Za-z0-9._~+\/-]+={0,2}$/u.test(value)
            ) {
              throw new Error(`The ${name} must be 32..4096 canonical ASCII bytes`)
            }
          }
          if (ownerAuthorityToken === serviceToken) throw new Error('The loopback authority tokens must be independently scoped')
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          for (const value of [process.env.MASK_OPENAI, process.env.MASK_ANTHROPIC, process.env.MASK_GEMINI, process.env.MASK_SERVICE_TOKEN, process.env.MASK_OWNER_AUTHORITY_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]) {
            if (!value) throw new Error('Required protected evaluation service secret is missing')
            const variants = [value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('base64url'), Buffer.from(value).toString('hex'), encodeURIComponent(value)]
