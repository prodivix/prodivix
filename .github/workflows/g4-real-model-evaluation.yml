          const endpoint = new URL(process.env.PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL ?? '')
          const loopback = endpoint.protocol === 'http:' && endpoint.hostname === '127.0.0.1' && endpoint.port === '8790'
          if ((!loopback && endpoint.protocol !== 'https:') || endpoint.username || endpoint.password || endpoint.search || endpoint.hash) {
            throw new Error('The ledger endpoint must be fixed loopback HTTP or credential-free HTTPS')
          }
          NODE
      - name: Set up Go for the Backend ledger
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Build exact Backend evaluation ledger
        shell: bash
        env:
          GOPROXY: 'off'
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-finalize
        run: |
          set -euo pipefail
          test ! -e "${LEDGER_BINARY}"
          (
            cd apps/backend
            go build -trimpath -o "${LEDGER_BINARY}" ./cmd/agent-evaluation-ledger
          )
