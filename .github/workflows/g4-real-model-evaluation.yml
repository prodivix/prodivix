          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_STATE_DIRECTORY: ${{ runner.temp }}/g4-model-eval-owner-authority-state
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH: ${{ runner.temp }}/g4-model-eval-owner-authority-state/shutdown-receipt.json
          PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_PRIVATE_KEY_PKCS8_BASE64URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_PRIVATE_KEY_PKCS8_BASE64URL }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_KEY_ID }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_ISSUER: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_ISSUER }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_AUDIENCE: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_AUDIENCE }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_SUBJECT: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_SUBJECT }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_TRUST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_TRUST }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_POLICY_GENERATION: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_POLICY_GENERATION }}
          PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_MAXIMUM_LIFETIME_MS: ${{ vars.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_MAXIMUM_LIFETIME_MS }}
          OWNER_AUTHORITY_LOG: ${{ runner.temp }}/g4-model-eval-owner-authority.log
          OWNER_AUTHORITY_PID_FILE: ${{ runner.temp }}/g4-model-eval-owner-authority.pid
        run: |
          set -euo pipefail
          mkdir -p "${PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_STATE_DIRECTORY}"
          test ! -e "${PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}"
          if curl --fail --silent --max-time 1 "${PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL}/healthz" >/dev/null 2>&1; then
            echo '::error::A pre-existing owner authority health endpoint is reachable.'
            exit 1
          fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8791,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Owner authority loopback port 8791 is already occupied.'
            exit 1
          fi
          node apps/agent-evaluation-runner/dist/productionOwnerAuthoritySidecarMain.js > "${OWNER_AUTHORITY_LOG}" 2>&1 &
          owner_authority_pid=$!
          if ! [[ "${owner_authority_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${owner_authority_pid}" > "${OWNER_AUTHORITY_PID_FILE}"); then
            kill -TERM "${owner_authority_pid}" 2>/dev/null || true
            wait "${owner_authority_pid}" 2>/dev/null || true
            echo '::error::Owner authority PID could not be recorded exclusively.'
            exit 1
          fi
          chmod 0600 "${OWNER_AUTHORITY_PID_FILE}"
          if ! pnpm exec tsx scripts/verify-g4-evaluation-owner-lifecycle.mjs owner-health full-attempt 60000 >> "${GITHUB_OUTPUT}"; then
            if ! kill -0 "${owner_authority_pid}" 2>/dev/null; then
              echo '::error::Controlled Workspace and G3 owner authority exited before readiness.'
            else
              echo '::error::Controlled Workspace and G3 owner authority did not become healthy.'
            fi
            exit 1
          fi
      - name: Verify activated Backend-owned evaluation ledger
        shell: bash
        env:
          EXPECTED_OWNER_HEALTH_DIGEST: ${{ steps.owner_authority.outputs.startup_health_digest }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/verify-g4-evaluation-owner-lifecycle.mjs activation active full-attempt 60000 >/dev/null
      - name: Execute exact shard with global atomic budget
        id: run_shard
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          SHARD_ID: ${{ matrix.shard }}
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_HOLDOUT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOLDOUT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          node apps/agent-evaluation-runner/dist/cli.js \
            run-shard \
            --plan "${PLAN_PATH}" \
            --shard "${SHARD_ID}"
      - name: Export sanitized shard status
        if: always()
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          SHARD_ID: ${{ matrix.shard }}
          STATUS_DIR: ${{ runner.temp }}/g4-real-model-shard-status
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${STATUS_DIR}"
          node apps/agent-evaluation-runner/dist/cli.js \
            status \
            --plan "${PLAN_PATH}" \
            --shard "${SHARD_ID}" \
            --output "${STATUS_DIR}/status.json"
      - name: Scan shard status for protected secret values
        id: shard_safety
        if: always()
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/g4-real-model-shard-status
          MASK_OPENAI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          MASK_ANTHROPIC: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_API_KEY }}
          MASK_GEMINI: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          MASK_HOLDOUT_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOLDOUT_KEY_BASE64 }}
          MASK_RESULT_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          MASK_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64 }}
          MASK_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          MASK_NATIVE_PROVIDER_STATE_VAULT_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          MASK_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PRIVATE_KEY }}
          MASK_G3_ATTESTATION_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_G3_ATTESTATION_PRIVATE_KEY_PKCS8_BASE64URL }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_OWNER_AUTHORITY_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          MASK_VERIFICATION_OWNER_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_OWNER_TOKEN }}
          MASK_VERIFICATION_RESUME_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_VERIFICATION_RESUME_KEY_BASE64 }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -d "${ARTIFACT_DIR}"
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const needles = []
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          const decodeCanonicalAes256Key = (name, encoded) => {
            const key = Buffer.from(encoded ?? '', 'base64')
            if (!/^[A-Za-z0-9+/]{43}=$/u.test(encoded ?? '') || key.byteLength !== 32 || key.toString('base64') !== encoded) {
              key.fill(0)
              throw new Error(`The ${name} must be exactly 32 canonical base64-decoded bytes`)
            }
            return key
          }
          const resultSpoolKey = decodeCanonicalAes256Key('result-spool key', process.env.MASK_RESULT_SPOOL_KEY)
          const capabilityProbeResponseSpoolKey = decodeCanonicalAes256Key('capability-probe response spool key', process.env.MASK_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY)
          const capabilityEffectProviderJournalSpoolKey = decodeCanonicalAes256Key('capability-effect Provider journal spool key', process.env.MASK_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY)
          const nativeProviderStateVaultKey = decodeCanonicalAes256Key('native Provider state-vault key', process.env.MASK_NATIVE_PROVIDER_STATE_VAULT_KEY)
          const verificationResumeKey = decodeCanonicalAes256Key('Verification resume key', process.env.MASK_VERIFICATION_RESUME_KEY)
          const nativeProviderStateVaultKeyVariants = []
          const decodeCanonicalEd25519Pkcs8Key = (name, encoded) => {
            const key = Buffer.from(encoded ?? '', 'base64url')
            if (!/^[A-Za-z0-9_-]{64}$/u.test(encoded ?? '') || key.byteLength !== 48 || key.toString('base64url') !== encoded || key.subarray(0, 16).toString('hex') !== '302e020100300506032b657004220420') {
              key.fill(0)
              throw new Error(`The ${name} must be one canonical 48-byte Ed25519 PKCS8 key`)
            }
            return key
          }
          const modelEvaluationAttestationKey = decodeCanonicalEd25519Pkcs8Key('model-evaluation attestation key', process.env.MASK_ATTESTATION_KEY)
          const g3AttestationKey = decodeCanonicalEd25519Pkcs8Key('G3 evidence attestation key', process.env.MASK_G3_ATTESTATION_KEY)
          const attestationKeyVariants = []
          try {
            if (nativeProviderStateVaultKey.equals(resultSpoolKey)) throw new Error('The native Provider state-vault key must be physically independent from the result-spool key')
            if ([resultSpoolKey, capabilityProbeResponseSpoolKey, nativeProviderStateVaultKey].some((key) => capabilityEffectProviderJournalSpoolKey.equals(key))) throw new Error('The capability-effect Provider journal spool key must be physically independent from result, probe, and state-vault keys')
            if (verificationResumeKey.equals(resultSpoolKey) || verificationResumeKey.equals(nativeProviderStateVaultKey)) throw new Error('The Verification resume key must be physically independent from spool and state-vault keys')
            if (g3AttestationKey.equals(modelEvaluationAttestationKey)) throw new Error('The G3 evidence attestation key must be physically independent from the model-evaluation archive key')
            nativeProviderStateVaultKeyVariants.push(nativeProviderStateVaultKey.toString('base64url'), nativeProviderStateVaultKey.toString('hex'), capabilityEffectProviderJournalSpoolKey.toString('base64url'), capabilityEffectProviderJournalSpoolKey.toString('hex'), verificationResumeKey.toString('base64url'), verificationResumeKey.toString('hex'))
            for (const key of [modelEvaluationAttestationKey, g3AttestationKey]) attestationKeyVariants.push(key.toString('base64'), key.toString('base64url'), key.toString('hex'))
          } finally {
            resultSpoolKey.fill(0)
            capabilityProbeResponseSpoolKey.fill(0)
            capabilityEffectProviderJournalSpoolKey.fill(0)
            nativeProviderStateVaultKey.fill(0)
            verificationResumeKey.fill(0)
            modelEvaluationAttestationKey.fill(0)
            g3AttestationKey.fill(0)
          }
          const values = [process.env.MASK_OPENAI, process.env.MASK_ANTHROPIC, process.env.MASK_GEMINI, process.env.MASK_HOLDOUT_KEY, process.env.MASK_RESULT_SPOOL_KEY, process.env.MASK_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY, process.env.MASK_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY, process.env.MASK_NATIVE_PROVIDER_STATE_VAULT_KEY, process.env.MASK_VERIFICATION_RESUME_KEY, process.env.MASK_ATTESTATION_KEY, process.env.MASK_G3_ATTESTATION_KEY, process.env.MASK_SERVICE_TOKEN, process.env.MASK_OWNER_AUTHORITY_TOKEN, process.env.MASK_VERIFICATION_OWNER_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]
          for (const value of values) {
            if (!value) throw new Error('A required protected evaluation secret is missing')
            needles.push(value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('base64url'), Buffer.from(value).toString('hex'), encodeURIComponent(value))
          }
          needles.push(...nativeProviderStateVaultKeyVariants)
          needles.push(...attestationKeyVariants)
          const visit = (entry) => {
            for (const child of fs.readdirSync(entry, { withFileTypes: true })) {
              const target = path.join(entry, child.name)
              if (child.isDirectory()) visit(target)
              else {
                const bytes = fs.readFileSync(target)
                for (const needle of needles) if (bytes.includes(Buffer.from(needle))) throw new Error(`Secret found in ${child.name}`)
              }
            }
          }
          visit(process.env.ARTIFACT_DIR)
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Derive safe shard artifact component
        id: shard_artifact
        if: always()
        shell: bash
        env:
          SHARD_ID: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          [[ "${SHARD_ID}" =~ ^evaluation-shard:([0-9a-f]{64})$ ]]
          echo "value=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
      - name: Upload sanitized shard status
        id: upload_shard
        if: >-
          always() &&
          steps.shard_safety.outputs.safe == 'true' &&
          steps.shard_artifact.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g4-real-model-shard-${{ steps.shard_artifact.outputs.value }}-${{ needs.preflight.outputs.repository_commit }}-${{ needs.preflight.outputs.evaluation_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g4-real-model-shard-status
          if-no-files-found: warn
          retention-days: 30
      - name: Record shard artifact digest
        if: always() && steps.upload_shard.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_shard.outputs['artifact-digest'] }}
          SHARD_ID: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          artifact_digest="${ARTIFACT_DIGEST}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${artifact_digest}"
          fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "- shard \`${SHARD_ID}\` artifact SHA-256: \`${artifact_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop PID-bound shard authorities
        if: always()
        shell: bash
        env:
          OWNER_AUTHORITY_PID_FILE: ${{ runner.temp }}/g4-model-eval-owner-authority.pid
          OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH: ${{ runner.temp }}/g4-model-eval-owner-authority-state/shutdown-receipt.json
          EXPECTED_ATTEMPT_GRADING_DIGEST: ${{ steps.owner_authority.outputs.attempt_grading_digest }}
          EXPECTED_CONTROLLED_WORKSPACE_DIGEST: ${{ steps.owner_authority.outputs.controlled_workspace_digest }}
          EXPECTED_PROVIDER_CAPABILITY_DIGEST: ${{ steps.owner_authority.outputs.provider_capability_digest }}
          EXPECTED_REPLAY_JOURNAL_DIGEST: ${{ steps.owner_authority.outputs.replay_journal_digest }}
          EXPECTED_STARTUP_HEALTH_DIGEST: ${{ steps.owner_authority.outputs.startup_health_digest }}
          EXPECTED_VERIFICATION_EVIDENCE_DIGEST: ${{ steps.owner_authority.outputs.verification_evidence_digest }}
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          LEDGER_LOG: ${{ runner.temp }}/g4-agent-evaluation-ledger-recovery.log
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-model-eval-ledger.pid
          VERIFICATION_BINARY: ${{ runner.temp }}/g4-verification-owner-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          VERIFICATION_PID_FILE: ${{ runner.temp }}/g4-verification-owner.pid
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_LEDGER_LISTEN_ADDRESS: 127.0.0.1:8790
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_OWNER_INSTANCE_ID: ${{ github.run_id }}.${{ github.run_attempt }}.${{ matrix.shard }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_RECOVERY_ONLY: '1'
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_OWNER_INSTANCE_ID: ${{ github.run_id }}.${{ github.run_attempt }}.${{ matrix.shard }}.provider-journal
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL: ''
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ''
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_PURPOSE: ''
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ''
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ''
          PRODIVIX_G4_MODEL_EVAL_PUBLIC_RESPONSE_CANARIES_BASE64URL: ''
          PRODIVIX_G4_MODEL_EVAL_PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          SHARD_ID: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          cleanup_failed=0
          owner_was_started=0
          if [[ -e "${OWNER_AUTHORITY_PID_FILE}" ]]; then
            owner_was_started=1
          fi
          stop_owned_process() {
            local pid_file="$1"
            local expected_executable="$2"
            local expected_command="$3"
            local label="$4"
            local shutdown_wait_seconds="$5"
            if [[ ! -e "${pid_file}" ]]; then
              return 0
            fi
            if [[ -L "${pid_file}" || ! -f "${pid_file}" ]]; then
              echo "::error::${label} PID authority is not a regular file."
              return 1
            fi
            local pid=''
            IFS= read -r pid < "${pid_file}" || true
            if ! [[ "${pid}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::${label} PID authority is invalid."
              return 1
            fi
            if kill -0 "${pid}" 2>/dev/null; then
              local expected_executable_path=''
              if [[ "${expected_executable}" == */* ]]; then
                expected_executable_path="$(readlink -f -- "${expected_executable}" 2>/dev/null || true)"
              else
                expected_executable_path="$(command -v "${expected_executable}" 2>/dev/null || true)"
                expected_executable_path="$(readlink -f -- "${expected_executable_path}" 2>/dev/null || true)"
              fi
              if [[ -z "${expected_executable_path}" ]]; then
                echo "::error::${label} expected executable identity is unavailable."
                return 1
              fi
              process_identity_matches() {
                local current_executable=''
                local current_command=''
                current_executable="$(readlink -f -- "/proc/${pid}/exe" 2>/dev/null || true)"
                current_command="$(tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null || true)"
                [[ "${current_executable}" == "${expected_executable_path}" && "${current_command}" == *"${expected_command}"* ]]
              }
              if ! process_identity_matches; then
                if kill -0 "${pid}" 2>/dev/null; then
                  echo "::error::${label} PID belongs to an unexpected process."
                  return 1
                fi
              else
                kill -TERM "${pid}" 2>/dev/null || true
                for _ in $(seq 1 "${shutdown_wait_seconds}"); do
                  if ! kill -0 "${pid}" 2>/dev/null; then
                    break
                  fi
                  sleep 1
                done
                if kill -0 "${pid}" 2>/dev/null; then
                  if ! process_identity_matches; then
                    if kill -0 "${pid}" 2>/dev/null; then
                      echo "::error::${label} PID identity changed during shutdown."
                      return 1
                    fi
                  else
                    kill -KILL "${pid}" 2>/dev/null || true
                    for _ in $(seq 1 5); do
                      if ! kill -0 "${pid}" 2>/dev/null; then
                        break
                      fi
                      if ! process_identity_matches; then
                        echo "::error::${label} PID identity changed after KILL; preserving PID authority for diagnosis."
                        return 1
                      fi
                      sleep 1
                    done
                    if kill -0 "${pid}" 2>/dev/null; then
                      echo "::error::${label} remained alive after the bounded KILL wait; preserving PID authority for diagnosis."
                      return 1
                    fi
                  fi
                fi
              fi
            fi
            rm -f -- "${pid_file}"
          }
          stop_owned_process "${OWNER_AUTHORITY_PID_FILE}" 'node' 'apps/agent-evaluation-runner/dist/productionOwnerAuthoritySidecarMain.js' 'Owner authority' 120 || cleanup_failed=1
          if (( owner_was_started == 1 )); then
            if [[ ! -f "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" || -L "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" || "$(stat -c '%a' "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" 2>/dev/null || true)" != '600' ]]; then
              echo '::error::Owner authority canonical shutdown receipt is unavailable.'
              cleanup_failed=1
            elif pnpm exec tsx scripts/verify-g4-evaluation-owner-lifecycle.mjs shutdown-receipt full-attempt >/dev/null
            then
              rm -f -- "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}"
            else
              echo '::error::Owner authority shutdown receipt drifted or retained residuals.'
              cleanup_failed=1
            fi
          elif [[ -e "${OWNER_AUTHORITY_SHUTDOWN_RECEIPT_PATH}" ]]; then
            echo '::error::Owner authority shutdown receipt exists without an owned PID.'
            cleanup_failed=1
          fi
          recover_state_vault() {
            if [[ ! -f "${LEDGER_BINARY}" || -L "${LEDGER_BINARY}" || ! -x "${LEDGER_BINARY}" ]]; then
              echo '::error::Evaluation ledger executable authority is unavailable for state-vault recovery.'
              return 1
            fi
            if ! rm -f -- "${LEDGER_PID_FILE}"; then
              echo '::error::Evaluation ledger stale PID authority could not be retired for state-vault recovery.'
              return 1
            fi
            if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
              echo '::error::State-vault recovery loopback port 8790 is already occupied.'
              return 1
            fi
            "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
            local recovery_pid=$!
            if ! [[ "${recovery_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${recovery_pid}" > "${LEDGER_PID_FILE}"); then
              kill -TERM "${recovery_pid}" 2>/dev/null || true
              wait "${recovery_pid}" 2>/dev/null || true
              echo '::error::State-vault recovery PID could not be recorded exclusively.'
              return 1
            fi
            chmod 0600 "${LEDGER_PID_FILE}"
            local recovery_failed=0
            local journal_health_digest=''
            if journal_health_digest="$(pnpm exec tsx scripts/verify-g4-capability-effect-provider-journal-lifecycle.mjs health 15000)"; then
              echo "- shard recovery capability-effect Provider journal health: \`${journal_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo '::error::Shard recovery capability-effect Provider journal health did not become exact and clean.'
              recovery_failed=1
            fi
            local journal_lifecycle_digest=''
            if journal_lifecycle_digest="$(pnpm exec tsx scripts/verify-g4-capability-effect-provider-journal-lifecycle.mjs cleanup-shard 120000)"; then
              echo "- shard recovery capability-effect Provider journal zero-residual lifecycle: \`${journal_lifecycle_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo '::error::Shard recovery capability-effect Provider journal cleanup did not reach its per-attempt and owner zero-residual terminus.'
              recovery_failed=1
            fi
            local recovery_digest=''
            if ! recovery_digest="$(pnpm exec tsx scripts/verify-g4-native-provider-state-vault-recovery.mjs recover 130000)"; then
              echo '::error::Shard state-vault crash recovery did not seal its durable receipt and zero-residual terminus.'
              recovery_failed=1
            else
              echo "- shard state-vault crash-recovery zero-residual receipt: \`${recovery_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
            fi
            return "${recovery_failed}"
          }
          ledger_pid_for_health=''
          if [[ -e "${LEDGER_PID_FILE}" ]]; then
            if [[ -L "${LEDGER_PID_FILE}" || ! -f "${LEDGER_PID_FILE}" || "$(stat -c '%a' "${LEDGER_PID_FILE}" 2>/dev/null || true)" != '600' ]]; then
              echo '::error::Evaluation ledger PID authority is invalid before state-vault closure.'
              cleanup_failed=1
            else
              IFS= read -r ledger_pid_for_health < "${LEDGER_PID_FILE}" || true
              if ! [[ "${ledger_pid_for_health}" =~ ^[1-9][0-9]*$ ]]; then
                echo '::error::Evaluation ledger PID authority is not numeric before state-vault closure.'
                cleanup_failed=1
              elif ! kill -0 "${ledger_pid_for_health}" 2>/dev/null; then
                recover_state_vault || cleanup_failed=1
              else
                expected_ledger_executable="$(readlink -f -- "${LEDGER_BINARY}" 2>/dev/null || true)"
                current_ledger_executable="$(readlink -f -- "/proc/${ledger_pid_for_health}/exe" 2>/dev/null || true)"
                current_ledger_command="$(tr '\0' ' ' < "/proc/${ledger_pid_for_health}/cmdline" 2>/dev/null || true)"
                if [[ -z "${expected_ledger_executable}" || "${current_ledger_executable}" != "${expected_ledger_executable}" || "${current_ledger_command}" != *"${LEDGER_BINARY}"* ]]; then
                  if kill -0 "${ledger_pid_for_health}" 2>/dev/null; then
                    echo '::error::Evaluation ledger PID belongs to an unexpected process before state-vault closure.'
                    cleanup_failed=1
                  else
                    recover_state_vault || cleanup_failed=1
                  fi
                else
                  journal_lifecycle_digest=''
                  if journal_lifecycle_digest="$(pnpm exec tsx scripts/verify-g4-capability-effect-provider-journal-lifecycle.mjs cleanup-shard 120000)"; then
                    echo "- shard capability-effect Provider journal zero-residual lifecycle: \`${journal_lifecycle_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
                  else
                    echo '::error::Shard capability-effect Provider journal cleanup did not reach its per-attempt and owner zero-residual terminus.'
                    cleanup_failed=1
                  fi
                  state_vault_health_digest=''
                  if state_vault_health_digest="$(pnpm exec tsx scripts/verify-g4-native-provider-state-vault-health.mjs zero 130000)"; then
                    echo "- shard state-vault zero-residual health: \`${state_vault_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
                  else
                    echo '::error::Shard state-vault did not reach the instance-bound zero-residual terminus.'
                    cleanup_failed=1
                  fi
                fi
              fi
            fi
          else
            recover_state_vault || cleanup_failed=1
          fi
          stop_owned_process "${VERIFICATION_PID_FILE}" "${VERIFICATION_BINARY}" "${VERIFICATION_BINARY}" 'Backend Verification owner' 60 || cleanup_failed=1
          stop_owned_process "${LEDGER_PID_FILE}" "${LEDGER_BINARY}" "${LEDGER_BINARY}" 'Evaluation ledger' 60 || cleanup_failed=1
          exit "${cleanup_failed}"

  hosted_cleanup:
    name: Cleanup singleton Hosted retrieval runtime resources
    if: >-
      always() &&
      needs.preflight.outputs.mode == 'evaluate' &&
      needs.preflight.outputs.suite == 'full' &&
      needs.plan.result == 'success' &&
      needs.smoke.result == 'success' &&
      needs.hosted_prepare.result == 'success' &&
      contains(fromJSON('["success","failure","cancelled"]'), needs.full_shards.result)
    needs:
      - preflight
      - plan
      - smoke
      - hosted_prepare
      - full_shards
    runs-on: [self-hosted, linux, x64, g4-real-model-evaluation]
    timeout-minutes: 45
    environment: g4-real-model-evaluation
    permissions:
      contents: read
    env:
      PRODIVIX_G4_MODEL_EVAL_ENABLED: '1'
      PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL: http://127.0.0.1:8790
      PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL: http://127.0.0.1:8791
      PRODIVIX_G4_MODEL_EVAL_NAMESPACE: ${{ needs.preflight.outputs.evaluation_namespace }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_ROOT: ${{ github.workspace }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ needs.plan.outputs.plan_artifact_name }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ needs.plan.outputs.plan_artifact_run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_NAME: g4-real-model-evaluation
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_JOB_ID: full_shards
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_JOB_ID: full_shards
      PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST }}
      PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_ROLE: cleanup
      PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_OWNER_INSTANCE_ID: g4.hosted-lifecycle.${{ github.run_id }}.${{ github.run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_FROZEN_CONFIG_COMMITMENT_PATH: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/input/frozen-config-commitment.json
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.repository_commit }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Set up Go for the Backend ledger
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Download same-run frozen plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Download same-run signed frozen config commitment
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.frozen_config_commitment_artifact_name }}
          path: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/input
      - name: Download exact singleton Hosted prepared set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.hosted_prepare.outputs.prepared_artifact_name }}
          path: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/input
      - name: Admit same-run generated production config
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
          PREPARED_SET: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/input/hosted-runtime-resource-prepared.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = fs.realpathSync(process.env.PLAN_ARTIFACT_ROOT)
          const target = process.env.GENERATED_CONFIG
          const stat = fs.lstatSync(target)
          const displacement = path.relative(root, fs.realpathSync(target))
          if (!stat.isFile() || stat.isSymbolicLink() || displacement === '..' || displacement.startsWith(`..${path.sep}`) || path.isAbsolute(displacement) || stat.size < 2 || stat.size > 16_777_216) {
            throw new Error('The generated production config is not one bounded regular artifact file')
          }
          for (const candidate of [process.env.PREPARED_SET, process.env.PRODIVIX_G4_MODEL_EVAL_FROZEN_CONFIG_COMMITMENT_PATH]) {
            const candidateStat = fs.lstatSync(candidate)
            if (!candidateStat.isFile() || candidateStat.isSymbolicLink() || candidateStat.size < 2 || candidateStat.size > 16_777_216) throw new Error('The Hosted prepared authority artifact is invalid')
          }
          NODE
          echo "PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH=${GENERATED_CONFIG}" >> "${GITHUB_ENV}"
      - name: Build exact Backend evaluation ledger
        shell: bash
        env:
          GOPROXY: 'off'
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-hosted-cleanup
        run: |
          set -euo pipefail
          test ! -e "${LEDGER_BINARY}"
          (cd apps/backend && go build -trimpath -o "${LEDGER_BINARY}" ./cmd/agent-evaluation-ledger)
          test -f "${LEDGER_BINARY}"
          test ! -L "${LEDGER_BINARY}"
          test -x "${LEDGER_BINARY}"
      - name: Register lifecycle secret masks and verify physical key isolation
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs mask
      - name: Start Backend-owned evaluation ledger
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_LEDGER_LISTEN_ADDRESS: 127.0.0.1:8790
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-hosted-cleanup
          LEDGER_LOG: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/ledger.log
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/ledger.pid
        run: |
          set -euo pipefail
          if curl --fail --silent --max-time 1 "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz" >/dev/null 2>&1; then echo '::error::A pre-existing evaluation ledger health endpoint is reachable.'; exit 1; fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then echo '::error::Evaluation ledger loopback port 8790 is already occupied.'; exit 1; fi
          mkdir -p "$(dirname "${LEDGER_LOG}")"
          "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
          ledger_pid=$!
          (set -o noclobber; printf '%s\n' "${ledger_pid}" > "${LEDGER_PID_FILE}")
          chmod 0600 "${LEDGER_PID_FILE}"
          for _ in $(seq 1 60); do
            kill -0 "${ledger_pid}" 2>/dev/null || { echo '::error::Evaluation ledger exited before readiness.'; exit 1; }
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz" || true)"
            if [[ "${status}" = '204' ]]; then exit 0; fi
            sleep 1
          done
          echo '::error::Evaluation ledger did not become healthy.'
          exit 1
      - name: Start independent Hosted lifecycle Provider listener
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_STATE_DIRECTORY: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/state
          LIFECYCLE_LOG: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/listener.log
          LIFECYCLE_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/listener.pid
        run: |
          set -euo pipefail
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8791,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then echo '::error::Hosted lifecycle listener loopback port 8791 is already occupied.'; exit 1; fi
          mkdir -p "${PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_STATE_DIRECTORY}"
          node apps/agent-evaluation-runner/dist/productionHostedRetrievalRuntimeResourceLifecycleSidecarMain.js > "${LIFECYCLE_LOG}" 2>&1 &
          lifecycle_pid=$!
          (set -o noclobber; printf '%s\n' "${lifecycle_pid}" > "${LIFECYCLE_PID_FILE}")
          chmod 0600 "${LIFECYCLE_PID_FILE}"
          if ! lifecycle_health_digest="$(pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs ready 60000)"; then
            kill -0 "${lifecycle_pid}" 2>/dev/null || echo '::error::Hosted lifecycle listener exited before readiness.'
            echo '::error::Hosted lifecycle listener did not return authenticated canonical readiness.'
            exit 1
          fi
          kill -0 "${lifecycle_pid}" 2>/dev/null || { echo '::error::Hosted lifecycle listener exited after readiness.'; exit 1; }
          echo "- Hosted lifecycle cleanup health: \`${lifecycle_health_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
      - name: Cleanup exact Hosted runtime resource set once after all shards
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_STATE_DIRECTORY: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/state
          PREPARED_SET_PATH: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/input/hosted-runtime-resource-prepared.json
          CLEANUP_OUTPUT_PATH: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/hosted-runtime-resource-cleanup.json
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/verify-g4-hosted-retrieval-runtime-resource-lifecycle.mjs cleanup --prepared-set "${PREPARED_SET_PATH}" --output "${CLEANUP_OUTPUT_PATH}"
      - name: Stop PID-bound Hosted lifecycle authorities
        if: always()
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-hosted-cleanup
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/ledger.pid
          LIFECYCLE_PID_FILE: ${{ runner.temp }}/g4-hosted-runtime-resource-cleanup/listener.pid
        run: |
          set -euo pipefail
          stop_process() {
            local pid_file="$1" expected="$2"
            [[ -f "${pid_file}" ]] || return 0
            local pid
            pid="$(cat "${pid_file}")"
            [[ "${pid}" =~ ^[1-9][0-9]*$ ]] || return 1
            if kill -0 "${pid}" 2>/dev/null; then
              tr '\0' ' ' < "/proc/${pid}/cmdline" | grep -F -- "${expected}" >/dev/null
              kill -TERM "${pid}"
              for _ in $(seq 1 60); do kill -0 "${pid}" 2>/dev/null || break; sleep 1; done
              if kill -0 "${pid}" 2>/dev/null; then kill -KILL "${pid}"; fi
            fi
            rm -f -- "${pid_file}"
          }
          stop_process "${LIFECYCLE_PID_FILE}" 'productionHostedRetrievalRuntimeResourceLifecycleSidecarMain.js'
          stop_process "${LEDGER_PID_FILE}" "${LEDGER_BINARY}"
      - name: Scan Hosted cleanup artifacts for secrets and canaries
        if: always()
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_HOSTED_RETRIEVAL_RUNTIME_RESOURCE_LIFECYCLE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_RESULT_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_PROBE_RESPONSE_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_CAPABILITY_EFFECT_PROVIDER_JOURNAL_SPOOL_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_NATIVE_PROVIDER_STATE_VAULT_KEY_BASE64 }}
          PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OPENAI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_GEMINI_API_KEY }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
