      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ needs.plan.outputs.plan_artifact_run_attempt }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.repository_commit }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Download same-run frozen plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Admit same-run generated production config
        shell: bash
        env:
          GENERATED_CONFIG: ${{ runner.temp }}/g4-real-model-plan/production-run-config.json
          PLAN_ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = fs.realpathSync(process.env.PLAN_ARTIFACT_ROOT)
          const target = process.env.GENERATED_CONFIG
          const stat = fs.lstatSync(target)
          const displacement = path.relative(root, fs.realpathSync(target))
          if (!stat.isFile() || stat.isSymbolicLink() || displacement === '..' || displacement.startsWith(`..${path.sep}`) || path.isAbsolute(displacement) || stat.size < 2 || stat.size > 16_777_216) {
            throw new Error('The generated production config is not one bounded regular artifact file')
          }
          NODE
          echo "PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_PATH=${GENERATED_CONFIG}" >> "${GITHUB_ENV}"
      - name: Set up Go for the Backend ledger
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Build exact Backend evaluation ledger
        shell: bash
        env:
          GOPROXY: 'off'
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-export-review
        run: |
          set -euo pipefail
          test ! -e "${LEDGER_BINARY}"
          (
            cd apps/backend
            go build -trimpath -o "${LEDGER_BINARY}" ./cmd/agent-evaluation-ledger
          )
          test -f "${LEDGER_BINARY}"
          test ! -L "${LEDGER_BINARY}"
          test -x "${LEDGER_BINARY}"
      - name: Register evaluation service-secret masks
        shell: bash
        env:
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          node <<'NODE'
          const serviceToken = process.env.MASK_SERVICE_TOKEN ?? ''
          const serviceTokenBytes = Buffer.byteLength(serviceToken, 'utf8')
          if (
            serviceTokenBytes < 32 ||
            serviceTokenBytes > 4_096 ||
            !/^[A-Za-z0-9._~+\/-]+={0,2}$/u.test(serviceToken)
          ) {
            throw new Error('The evaluation service token must be 32..4096 canonical ASCII bytes')
          }
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          for (const value of [process.env.MASK_SERVICE_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]) {
            if (!value) throw new Error('A required evaluation service secret is missing')
            const variants = [value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value)]
            for (const variant of new Set(variants)) process.stdout.write(`::add-mask::${variant}\n`)
          }
          NODE
      - name: Start Backend-owned evaluation ledger
        shell: bash
        env:
          PRODIVIX_G4_MODEL_EVAL_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_LEDGER_LISTEN_ADDRESS: 127.0.0.1:8790
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-export-review
          LEDGER_LOG: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-export-review.log
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-export-review.pid
        run: |
          set -euo pipefail
          if curl --fail --silent --max-time 1 "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz" >/dev/null 2>&1; then
            echo '::error::A pre-existing evaluation ledger health endpoint is reachable.'
            exit 1
          fi
          if ! node -e "const server=require('node:net').createServer();server.once('error',()=>process.exit(1));server.listen({host:'127.0.0.1',port:8790,exclusive:true},()=>server.close((error)=>process.exit(error?1:0)))"; then
            echo '::error::Evaluation ledger loopback port 8790 is already occupied.'
            exit 1
          fi
          "${LEDGER_BINARY}" > "${LEDGER_LOG}" 2>&1 &
          ledger_pid=$!
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]] || ! (set -o noclobber; printf '%s\n' "${ledger_pid}" > "${LEDGER_PID_FILE}"); then
            kill -TERM "${ledger_pid}" 2>/dev/null || true
            wait "${ledger_pid}" 2>/dev/null || true
            echo '::error::Evaluation ledger PID could not be recorded exclusively.'
            exit 1
          fi
          chmod 0600 "${LEDGER_PID_FILE}"
          for _ in $(seq 1 60); do
            if ! kill -0 "${ledger_pid}" 2>/dev/null; then
              echo '::error::Evaluation ledger exited before readiness.'
              exit 1
            fi
            health_status=''
            if health_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL}/healthz")" && test "${health_status}" = '204'; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Evaluation ledger did not become healthy.'
          exit 1
      - name: Export the reviewer-only blinded bundle
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/g4-real-model-plan/plan.json
          REVIEW_DIR: ${{ runner.temp }}/g4-real-model-review
          PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          mkdir -p "${REVIEW_DIR}"
          node apps/agent-evaluation-runner/dist/cli.js \
            export-review \
            --plan "${PLAN_PATH}" \
            --output "${REVIEW_DIR}/blind-review.json"
      - name: Scan blind-review artifact for service-secret values
        id: review_safety
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/g4-real-model-review
          MASK_SERVICE_TOKEN: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SERVICE_TOKEN }}
          MASK_DATABASE_URL: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_DATABASE_URL }}
          MASK_SECRET_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_SECRET_CANARIES }}
          MASK_HOLDOUT_CANARIES: ${{ secrets.PRODIVIX_G4_MODEL_EVAL_PROTECTED_HOLDOUT_CANARIES }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const artifactRoot = process.env.ARTIFACT_DIR
          const entries = fs.readdirSync(artifactRoot, { withFileTypes: true })
          if (
            entries.length !== 1 ||
            entries[0].name !== 'blind-review.json' ||
            !entries[0].isFile()
          ) {
            throw new Error('The reviewer artifact must contain only root blind-review.json')
          }
          const blindReviewPath = path.join(artifactRoot, 'blind-review.json')
          const blindReviewStat = fs.lstatSync(blindReviewPath)
          if (!blindReviewStat.isFile() || blindReviewStat.isSymbolicLink()) {
            throw new Error('blind-review.json must be a regular file')
          }
          const needles = []
          const canaries = []
          for (const name of ['MASK_SECRET_CANARIES', 'MASK_HOLDOUT_CANARIES']) {
            let values
            try { values = JSON.parse(process.env[name] ?? '') } catch { throw new Error(`${name} must be valid JSON`) }
            if (!Array.isArray(values) || values.length === 0 || values.length > 256 || values.some((value) => typeof value !== 'string' || !/^[A-Za-z0-9._:@%+=/-]{8,4096}$/u.test(value)) || new Set(values).size !== values.length) {
              throw new Error(`${name} must be a bounded unique safe-ASCII token array`)
            }
            canaries.push(...values)
          }
          for (const value of [process.env.MASK_SERVICE_TOKEN, process.env.MASK_DATABASE_URL, ...canaries]) {
            if (!value) throw new Error('A required protected evaluation service secret is missing')
            needles.push(value, Buffer.from(value).toString('base64'), Buffer.from(value).toString('hex'), encodeURIComponent(value))
          }
          const visit = (entry) => {
            for (const child of fs.readdirSync(entry, { withFileTypes: true })) {
              const target = path.join(entry, child.name)
              if (child.isDirectory()) visit(target)
              else {
                const bytes = fs.readFileSync(target)
                for (const needle of needles) if (bytes.includes(Buffer.from(needle))) throw new Error(`Service secret found in ${child.name}`)
              }
            }
          }
          visit(artifactRoot)
          NODE
          echo 'safe=true' >> "${GITHUB_OUTPUT}"
      - name: Upload blind-review package
        id: upload_review
        if: steps.review_safety.outputs.safe == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g4-real-model-blind-review-${{ needs.preflight.outputs.repository_commit }}-${{ needs.preflight.outputs.evaluation_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g4-real-model-review
          if-no-files-found: error
          retention-days: 30
      - name: Record asynchronous review handoff
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_review.outputs['artifact-digest'] }}
          BLIND_ARTIFACT_NAME: g4-real-model-blind-review-${{ needs.preflight.outputs.repository_commit }}-${{ needs.preflight.outputs.evaluation_id }}-${{ github.run_attempt }}
          PLAN_ARTIFACT_NAME: ${{ needs.plan.outputs.plan_artifact_name }}
          PLAN_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
          PLAN_ARTIFACT_RUN_ATTEMPT: ${{ needs.plan.outputs.plan_artifact_run_attempt }}
        run: |
          set -euo pipefail
          artifact_digest="${ARTIFACT_DIGEST}"
          if [[ "${artifact_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${artifact_digest}"
          fi
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Human-review handoff'
            echo "- source evaluation run: \`${GITHUB_RUN_ID}\`"
            echo "- successful evaluation attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- blind-review artifact: \`${BLIND_ARTIFACT_NAME}\`"
            echo "- blind-review artifact SHA-256: \`${artifact_digest}\`"
            echo "- generated-plan artifact: \`${PLAN_ARTIFACT_NAME}\`"
            echo "- generated-plan artifact SHA-256: \`${PLAN_ARTIFACT_DIGEST}\`"
            echo "- generated-plan producer attempt: \`${PLAN_ARTIFACT_RUN_ATTEMPT}\`"
            echo '- disclosure: root blind-review.json contains only blinded candidate ids, raster bytes, public rubrics, and their digests'
            echo '- next boundary: two independent blind ratings plus frozen adjudication'
            echo '- qualification: Evidence pending until a separate finalize dispatch succeeds'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop PID-bound evaluation ledger
        if: always()
        shell: bash
        env:
          LEDGER_BINARY: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-export-review
          LEDGER_PID_FILE: ${{ runner.temp }}/g4-agent-evaluation-ledger-${{ github.run_id }}-${{ github.run_attempt }}-export-review.pid
        run: |
          set -uo pipefail
          if [[ ! -e "${LEDGER_PID_FILE}" ]]; then exit 0; fi
          if [[ -L "${LEDGER_PID_FILE}" || ! -f "${LEDGER_PID_FILE}" || "$(stat -c '%a' "${LEDGER_PID_FILE}" 2>/dev/null || true)" != '600' ]]; then
            echo '::error::Evaluation ledger PID authority is invalid.'
            exit 1
          fi
          ledger_pid=''
          IFS= read -r ledger_pid < "${LEDGER_PID_FILE}" || true
          if ! [[ "${ledger_pid}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Evaluation ledger PID authority is not numeric.'
            exit 1
          fi
          if kill -0 "${ledger_pid}" 2>/dev/null; then
            if [[ ! -f "${LEDGER_BINARY}" || -L "${LEDGER_BINARY}" || ! -x "${LEDGER_BINARY}" ]]; then
              echo '::error::Evaluation ledger executable authority is unavailable.'
              exit 1
            fi
            expected_executable="$(readlink -f -- "${LEDGER_BINARY}" 2>/dev/null || true)"
            process_identity_matches() {
              local current_executable current_command
              current_executable="$(readlink -f -- "/proc/${ledger_pid}/exe" 2>/dev/null || true)"
              current_command="$(tr '\0' ' ' < "/proc/${ledger_pid}/cmdline" 2>/dev/null || true)"
              [[ -n "${expected_executable}" && "${current_executable}" == "${expected_executable}" && "${current_command}" == *"${LEDGER_BINARY}"* ]]
            }
            if ! process_identity_matches; then
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                echo '::error::Evaluation ledger PID belongs to an unexpected process.'
                exit 1
              fi
            else
              kill -TERM "${ledger_pid}" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "${ledger_pid}" 2>/dev/null; then
                if ! process_identity_matches; then
                  echo '::error::Evaluation ledger PID identity changed during shutdown.'
                  exit 1
                fi
                kill -KILL "${ledger_pid}" 2>/dev/null || true
                for _ in $(seq 1 5); do
                  if ! kill -0 "${ledger_pid}" 2>/dev/null; then break; fi
                  sleep 1
                done
                if kill -0 "${ledger_pid}" 2>/dev/null; then
                  echo '::error::Evaluation ledger remained alive after bounded shutdown.'
                  exit 1
                fi
              fi
            fi
          fi
          rm -f -- "${LEDGER_PID_FILE}"

  finalize:
    name: Import review, sign evidence, and verify qualification
    if: needs.preflight.outputs.mode == 'finalize'
    needs: preflight
    runs-on: [self-hosted, linux, x64, g4-real-model-evaluation]
    timeout-minutes: 60
    environment: g4-real-model-evaluation
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL: http://127.0.0.1:8790
      PRODIVIX_G4_MODEL_EVAL_NAMESPACE: ${{ needs.preflight.outputs.evaluation_namespace }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_ROOT: ${{ github.workspace }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_NAME: ${{ needs.preflight.outputs.source_plan_artifact_name }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.source_plan_artifact_digest }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ID: ${{ needs.preflight.outputs.source_evaluation_run_id }}
      PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG_ARTIFACT_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_plan_run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_PUBLIC_KEY }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_KEY_ID }}
      PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ATTESTATION_AUTHORITY_ID }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_NAME: g4-real-model-evaluation
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ID: ${{ github.run_id }}
      PRODIVIX_G4_MODEL_EVAL_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      PRODIVIX_G4_MODEL_EVAL_JOB_ID: finalize
      PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST: ${{ vars.PRODIVIX_G4_MODEL_EVAL_ENVIRONMENT_DIGEST }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
