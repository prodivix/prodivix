name: G4 Real-model Evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the provider matrix or finalize an independently reviewed evaluation.
        required: true
        type: choice
        default: evaluate
        options:
          - evaluate
          - finalize
      suite:
        description: Evaluate only bounded endpoint admission or the frozen full matrix.
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full
      repository_commit:
        description: Exact 40-character commit to evaluate or finalize.
        required: true
        type: string
      evaluation_id:
        description: Stable resume identity; blank derives g4-<exact commit>.
        required: false
        type: string
      run_config:
        description: Tracked evidence-free qualification template; generated production authority is sealed before plan publication.
        required: true
        type: string
      budget_caps:
        description: JSON hard ceilings with maxCostUsd, maxLogicalTokens, and maxElapsedMinutes.
        required: false
        type: string
      enable_remote_models:
        description: Explicit remote-spend switch; evaluate mode accepts only enabled.
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      finalize_sources:
        description: JSON with exact deterministic, evaluation, plan-producer-attempt, and independent-review run/artifact identities.
        required: false
        type: string
  schedule:
    - cron: '17 3 1 */3 *'

permissions:
  contents: read

concurrency:
  group: >-
    g4-real-model-evaluation-${{
      github.event_name == 'schedule' && github.sha || inputs.repository_commit
    }}-${{ inputs.evaluation_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Freeze exact commit, config, identity, and hard budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      evidence_status: ${{ steps.remote_evidence.outputs.evidence_status }}
      mode: ${{ steps.remote_evidence.outputs.admitted == 'false' && 'evidence-pending' || steps.contract.outputs.mode }}
      suite: ${{ steps.contract.outputs.suite }}
      repository_commit: ${{ steps.contract.outputs.repository_commit }}
      evaluation_id: ${{ steps.contract.outputs.evaluation_id }}
      evaluation_namespace: ${{ steps.contract.outputs.evaluation_namespace }}
      run_config: ${{ steps.contract.outputs.run_config }}
      max_cost_usd: ${{ steps.contract.outputs.max_cost_usd }}
      max_logical_tokens: ${{ steps.contract.outputs.max_logical_tokens }}
      max_elapsed_minutes: ${{ steps.contract.outputs.max_elapsed_minutes }}
      openai_model_id: ${{ steps.contract.outputs.openai_model_id }}
      anthropic_model_id: ${{ steps.contract.outputs.anthropic_model_id }}
      gemini_model_id: ${{ steps.contract.outputs.gemini_model_id }}
      source_evaluation_run_id: ${{ steps.contract.outputs.source_evaluation_run_id }}
      source_evaluation_run_attempt: ${{ steps.contract.outputs.source_evaluation_run_attempt }}
      source_plan_run_attempt: ${{ steps.contract.outputs.source_plan_run_attempt }}
      source_plan_digest: ${{ steps.contract.outputs.source_plan_digest }}
      source_plan_artifact_name: ${{ steps.contract.outputs.source_plan_artifact_name }}
      source_plan_artifact_digest: ${{ steps.contract.outputs.source_plan_artifact_digest }}
      source_review_run_id: ${{ steps.contract.outputs.source_review_run_id }}
      source_review_run_attempt: ${{ steps.contract.outputs.source_review_run_attempt }}
      review_artifact_name: ${{ steps.contract.outputs.review_artifact_name }}
      review_artifact_digest: ${{ steps.contract.outputs.review_artifact_digest }}
      deterministic_run_id: ${{ steps.contract.outputs.deterministic_run_id }}
      deterministic_run_attempt: ${{ steps.contract.outputs.deterministic_run_attempt }}
      deterministic_artifact_name: ${{ steps.contract.outputs.deterministic_artifact_name }}
      deterministic_artifact_digest: ${{ steps.contract.outputs.deterministic_artifact_digest }}
    steps:
      - name: Resolve remote-model evidence availability
        id: remote_evidence
        shell: bash
        env:
          REQUEST_MODE: ${{ github.event_name == 'schedule' && 'evaluate' || inputs.mode }}
          REQUEST_REMOTE_ENABLE: >-
            ${{ github.event_name == 'schedule' && vars.PRODIVIX_G4_MODEL_EVAL_ENABLED || inputs.enable_remote_models }}
        run: |
          set -euo pipefail
          if [[ "${REQUEST_MODE}" = 'evaluate' && "${REQUEST_REMOTE_ENABLE}" != 'enabled' && "${REQUEST_REMOTE_ENABLE}" != '1' ]]; then
            echo 'admitted=false' >> "${GITHUB_OUTPUT}"
            echo 'evidence_status=evidence-pending' >> "${GITHUB_OUTPUT}"
            {
              echo '### G4 real-model release qualification'
              echo
              echo 'Configured / Evidence pending: remote-model evaluation is disabled and no Provider operation was dispatched.'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'admitted=true' >> "${GITHUB_OUTPUT}"
            echo 'evidence_status=admitted' >> "${GITHUB_OUTPUT}"
          fi
      - name: Checkout requested commit
        if: steps.remote_evidence.outputs.admitted == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'schedule' && github.sha || inputs.repository_commit }}
      - name: Validate frozen operation contract
        if: steps.remote_evidence.outputs.admitted == 'true'
        id: contract
        shell: bash
        env:
          REQUEST_MODE: ${{ github.event_name == 'schedule' && 'evaluate' || inputs.mode }}
          REQUEST_SUITE: ${{ github.event_name == 'schedule' && 'full' || inputs.suite }}
          REQUEST_COMMIT: ${{ github.event_name == 'schedule' && github.sha || inputs.repository_commit }}
          REQUEST_EVALUATION_ID: >-
            ${{ github.event_name == 'schedule' && vars.PRODIVIX_G4_MODEL_EVAL_EVALUATION_ID || inputs.evaluation_id }}
          REQUEST_RUN_CONFIG: >-
            ${{ github.event_name == 'schedule' && vars.PRODIVIX_G4_MODEL_EVAL_RUN_CONFIG || inputs.run_config }}
          REQUEST_BUDGET_CAPS: >-
            ${{ github.event_name == 'schedule' && vars.PRODIVIX_G4_MODEL_EVAL_BUDGET_CAPS || inputs.budget_caps }}
          REQUEST_REMOTE_ENABLE: >-
            ${{ github.event_name == 'schedule' && vars.PRODIVIX_G4_MODEL_EVAL_ENABLED || inputs.enable_remote_models }}
          REQUEST_FINALIZE_SOURCES: ${{ inputs.finalize_sources }}
        run: |
          set -euo pipefail

          actual_commit="$(git rev-parse HEAD)"
          test "${actual_commit}" = "${REQUEST_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "${actual_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REQUEST_MODE}" =~ ^(evaluate|finalize)$ ]]
          [[ "${REQUEST_SUITE}" =~ ^(smoke|full)$ ]]

          node <<'NODE'
          const path = require('node:path')
          const configPath = process.env.REQUEST_RUN_CONFIG ?? ''
          if (!configPath || path.isAbsolute(configPath)) {
            throw new Error('run_config must be a non-empty repository-relative path')
          }
          const normalized = path.posix.normalize(configPath.replaceAll('\\', '/'))
          if (normalized === '..' || normalized.startsWith('../')) {
            throw new Error('run_config must stay inside the repository')
          }
          if (!/^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,254}$/.test(normalized)) {
            throw new Error('run_config contains characters that are unsafe for workflow outputs')
          }
          NODE
          git ls-files --error-unmatch -- "${REQUEST_RUN_CONFIG}" >/dev/null
          test -f "${REQUEST_RUN_CONFIG}"

          evaluation_id="${REQUEST_EVALUATION_ID:-g4-${actual_commit}}"
          [[ "${evaluation_id}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,46}$ ]]
          evaluation_namespace="g4-${evaluation_id}-${actual_commit:0:12}"
          max_cost_usd='0'
          max_logical_tokens='0'
          max_elapsed_minutes='0'
          source_evaluation_run_id=''
          source_evaluation_run_attempt=''
          source_plan_run_attempt=''
          source_plan_digest=''
          source_plan_artifact_name=''
          source_plan_artifact_digest=''
          source_review_run_id=''
          source_review_run_attempt=''
          review_artifact_name=''
          review_artifact_digest=''
          deterministic_run_id=''
          deterministic_run_attempt=''
          deterministic_artifact_name=''
          deterministic_artifact_digest=''

          if [[ "${REQUEST_MODE}" = 'evaluate' ]]; then
            if [[ "${REQUEST_REMOTE_ENABLE}" != 'enabled' && "${REQUEST_REMOTE_ENABLE}" != '1' ]]; then
              echo '::error::Remote model evaluation requires the explicit enabled switch.'
              exit 1
            fi
            max_cost_usd="$(jq -er '.maxCostUsd | select(type == "string")' <<< "${REQUEST_BUDGET_CAPS}")"
            max_logical_tokens="$(jq -er '.maxLogicalTokens | select(type == "string")' <<< "${REQUEST_BUDGET_CAPS}")"
            max_elapsed_minutes="$(jq -er '.maxElapsedMinutes | select(type == "string")' <<< "${REQUEST_BUDGET_CAPS}")"
            test "$(jq -er 'keys | join(",")' <<< "${REQUEST_BUDGET_CAPS}")" = 'maxCostUsd,maxElapsedMinutes,maxLogicalTokens'
            REQUEST_MAX_COST_USD="${max_cost_usd}" \
            REQUEST_MAX_LOGICAL_TOKENS="${max_logical_tokens}" \
            REQUEST_MAX_ELAPSED_MINUTES="${max_elapsed_minutes}" \
              node <<'NODE'
          const positiveDecimal = /^(?:0|[1-9]\d*)(?:\.\d{1,6})?$/
          const positiveInteger = /^[1-9]\d*$/
          const cost = process.env.REQUEST_MAX_COST_USD ?? ''
          const logical = process.env.REQUEST_MAX_LOGICAL_TOKENS ?? ''
          const elapsed = process.env.REQUEST_MAX_ELAPSED_MINUTES ?? ''
          if (!positiveDecimal.test(cost) || Number(cost) <= 0) {
            throw new Error('max_cost_usd must be a positive decimal hard ceiling')
          }
          if (!positiveInteger.test(logical)) {
            throw new Error('max_logical_tokens must be a positive integer hard ceiling')
          }
          if (!positiveInteger.test(elapsed)) {
            throw new Error('max_elapsed_minutes must be a positive integer hard ceiling')
          }
          NODE
          else
            source_evaluation_run_id="$(jq -er '.evaluationRunId | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_evaluation_run_attempt="$(jq -er '.evaluationRunAttempt | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_plan_run_attempt="$(jq -er '.planArtifactRunAttempt | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_plan_digest="$(jq -er '.planDigest | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_plan_artifact_name="$(jq -er '.planArtifactName | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_plan_artifact_digest="$(jq -er '.planArtifactDigest | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_review_run_id="$(jq -er '.reviewRunId | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            source_review_run_attempt="$(jq -er '.reviewRunAttempt | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            review_artifact_name="$(jq -er '.reviewArtifactName | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            review_artifact_digest="$(jq -er '.reviewArtifactDigest | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            deterministic_run_id="$(jq -er '.deterministicRunId | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            deterministic_run_attempt="$(jq -er '.deterministicRunAttempt | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            deterministic_artifact_name="$(jq -er '.deterministicArtifactName | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            deterministic_artifact_digest="$(jq -er '.deterministicArtifactDigest | select(type == "string")' <<< "${REQUEST_FINALIZE_SOURCES}")"
            test "$(jq -er 'keys | join(",")' <<< "${REQUEST_FINALIZE_SOURCES}")" = 'deterministicArtifactDigest,deterministicArtifactName,deterministicRunAttempt,deterministicRunId,evaluationRunAttempt,evaluationRunId,planArtifactDigest,planArtifactName,planArtifactRunAttempt,planDigest,reviewArtifactDigest,reviewArtifactName,reviewRunAttempt,reviewRunId'
            [[ "${source_evaluation_run_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${source_evaluation_run_attempt}" =~ ^[1-9][0-9]*$ ]]
            [[ "${source_plan_run_attempt}" =~ ^[1-9][0-9]*$ ]]
            (( source_plan_run_attempt <= source_evaluation_run_attempt ))
            [[ "${source_review_run_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${source_review_run_attempt}" =~ ^[1-9][0-9]*$ ]]
            [[ "${deterministic_run_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${deterministic_run_attempt}" =~ ^[1-9][0-9]*$ ]]
            [[ "${source_plan_digest}" =~ ^sha256-[0-9a-f]{64}$ ]]
            [[ "${source_plan_artifact_name}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,254}$ ]]
            [[ "${source_plan_artifact_name}" =~ ^g4-real-model-plan-${actual_commit}-[a-zA-Z0-9][a-zA-Z0-9._-]{0,46}-${source_plan_run_attempt}$ ]]
            [[ "${source_plan_artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${review_artifact_name}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,254}$ ]]
            [[ "${review_artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${deterministic_artifact_name}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,254}$ ]]
            [[ "${deterministic_artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi

          openai_model_id="$(jq -er '.providers.openaiResponses.model.modelId | select(type == "string" and length > 0)' "${REQUEST_RUN_CONFIG}")"
          anthropic_model_id="$(jq -er '.providers.anthropicMessages.model.modelId | select(type == "string" and length > 0)' "${REQUEST_RUN_CONFIG}")"
          gemini_model_id="$(jq -er '.providers.geminiInteractions.model.modelId | select(type == "string" and length > 0)' "${REQUEST_RUN_CONFIG}")"
          [[ "${openai_model_id}" != *$'\n'* ]]
          [[ "${anthropic_model_id}" != *$'\n'* ]]
          [[ "${gemini_model_id}" != *$'\n'* ]]

          {
            echo "mode=${REQUEST_MODE}"
            echo "suite=${REQUEST_SUITE}"
            echo "repository_commit=${actual_commit}"
            echo "evaluation_id=${evaluation_id}"
            echo "evaluation_namespace=${evaluation_namespace}"
            echo "run_config=${REQUEST_RUN_CONFIG}"
            echo "max_cost_usd=${max_cost_usd}"
            echo "max_logical_tokens=${max_logical_tokens}"
            echo "max_elapsed_minutes=${max_elapsed_minutes}"
            echo "openai_model_id=${openai_model_id}"
            echo "anthropic_model_id=${anthropic_model_id}"
            echo "gemini_model_id=${gemini_model_id}"
            echo "source_evaluation_run_id=${source_evaluation_run_id}"
            echo "source_evaluation_run_attempt=${source_evaluation_run_attempt}"
            echo "source_plan_run_attempt=${source_plan_run_attempt}"
            echo "source_plan_digest=${source_plan_digest}"
            echo "source_plan_artifact_name=${source_plan_artifact_name}"
            echo "source_plan_artifact_digest=${source_plan_artifact_digest}"
            echo "source_review_run_id=${source_review_run_id}"
            echo "source_review_run_attempt=${source_review_run_attempt}"
            echo "review_artifact_name=${review_artifact_name}"
            echo "review_artifact_digest=${review_artifact_digest}"
            echo "deterministic_run_id=${deterministic_run_id}"
            echo "deterministic_run_attempt=${deterministic_run_attempt}"
            echo "deterministic_artifact_name=${deterministic_artifact_name}"
            echo "deterministic_artifact_digest=${deterministic_artifact_digest}"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Freeze evaluation plan and shard schedule
    if: needs.preflight.outputs.mode == 'evaluate'
    needs: preflight
    runs-on: [self-hosted, linux, x64, g4-real-model-evaluation]
    timeout-minutes: 45
    environment: g4-real-model-evaluation
    permissions:
      actions: read
      contents: read
    env:
      PRODIVIX_G4_MODEL_EVAL_ENABLED: '1'
      PRODIVIX_G4_MODEL_EVAL_SERVICE_BASE_URL: http://127.0.0.1:8790
      PRODIVIX_G4_MODEL_EVAL_OWNER_AUTHORITY_BASE_URL: http://127.0.0.1:8791
      PRODIVIX_G4_MODEL_EVAL_NAMESPACE: ${{ needs.preflight.outputs.evaluation_namespace }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
      PRODIVIX_G4_MODEL_EVAL_REPOSITORY_ROOT: ${{ github.workspace }}
      PRODIVIX_G4_MODEL_EVAL_OPENAI_MODEL_ID: ${{ needs.preflight.outputs.openai_model_id }}
      PRODIVIX_G4_MODEL_EVAL_ANTHROPIC_MODEL_ID: ${{ needs.preflight.outputs.anthropic_model_id }}
      PRODIVIX_G4_MODEL_EVAL_GEMINI_MODEL_ID: ${{ needs.preflight.outputs.gemini_model_id }}
      PRODIVIX_G4_MODEL_EVAL_MAX_COST_USD: ${{ needs.preflight.outputs.max_cost_usd }}
      PRODIVIX_G4_MODEL_EVAL_MAX_LOGICAL_TOKENS: ${{ needs.preflight.outputs.max_logical_tokens }}
      PRODIVIX_G4_MODEL_EVAL_MAX_ELAPSED_MINUTES: ${{ needs.preflight.outputs.max_elapsed_minutes }}
    outputs:
      shard_matrix: ${{ steps.shards.outputs.shard_matrix }}
      plan_artifact_name: ${{ steps.plan_authority.outputs.value }}
      plan_artifact_digest: ${{ steps.artifact_authority.outputs.digest }}
      plan_artifact_run_attempt: ${{ steps.plan_authority.outputs.producer_attempt }}
      frozen_config_commitment_artifact_name: ${{ steps.frozen_commitment_authority.outputs.value }}
      frozen_config_commitment_artifact_digest: ${{ steps.frozen_commitment_artifact.outputs.digest }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.repository_commit }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODIVIX_G4_MODEL_EVAL_REPOSITORY_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Resolve same-run immutable plan authority
        id: plan_authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
          EVALUATION_ID: ${{ needs.preflight.outputs.evaluation_id }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          base_name="g4-real-model-plan-${EXACT_COMMIT}-${EVALUATION_ID}"
          selected_name=''
          selected_digest=''
          selected_attempt=''

          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            artifact_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
            for ((attempt=1; attempt<GITHUB_RUN_ATTEMPT; attempt++)); do
              candidate="${base_name}-${attempt}"
              candidate_count="$(jq -er --arg name "${candidate}" '[.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length' <<< "${artifact_pages}")"
              if (( candidate_count > 1 )); then
                echo "::error::The same-run frozen plan artifact identity is ambiguous."
                exit 1
              fi
              if (( candidate_count == 1 )); then
                producer_job_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${attempt}/jobs?per_page=100" | jq -er '[.jobs[] | select(.name == "Freeze evaluation plan and shard schedule" and .status == "completed" and .conclusion == "success" and (.labels | index("self-hosted")) != null and (.labels | index("linux")) != null and (.labels | index("x64")) != null and (.labels | index("g4-real-model-evaluation")) != null)] | length')"
                if (( producer_job_count != 1 )); then
                  continue
                fi
                selected_name="${candidate}"
                selected_digest="$(jq -er --arg name "${candidate}" '[.[]?.artifacts[]? | select(.name == $name and .expired == false)][0].digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<< "${artifact_pages}")"
                selected_attempt="${attempt}"
                break
              fi
            done
          fi

          if [[ -n "${selected_name}" ]]; then
            {
              echo "value=${selected_name}"
              echo "digest=${selected_digest}"
              echo "producer_attempt=${selected_attempt}"
              echo 'reused=true'
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "value=${base_name}-${GITHUB_RUN_ATTEMPT}"
              echo 'digest='
              echo "producer_attempt=${GITHUB_RUN_ATTEMPT}"
              echo 'reused=false'
            } >> "${GITHUB_OUTPUT}"
          fi
      - name: Download prior-attempt same-run frozen plan
        if: steps.plan_authority.outputs.reused == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          name: ${{ steps.plan_authority.outputs.value }}
          path: ${{ runner.temp }}/g4-real-model-plan
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install frozen dependencies from the pre-adopted offline store
        run: pnpm install --offline --frozen-lockfile
      - name: Build evaluation runner
        run: pnpm --filter @prodivix/agent-evaluation-runner build
      - name: Admit prior-attempt production config and plan bytes
        if: steps.plan_authority.outputs.reused == 'true'
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/g4-real-model-plan
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.repository_commit }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { lstatSync, readFileSync, readdirSync, realpathSync } from 'node:fs'
          import { isAbsolute, join, relative, sep } from 'node:path'
          import {
            decodeAgentEvaluationFrozenRunConfig,
            requireProductionAgentEvaluationFrozenRunConfig,
          } from './apps/agent-evaluation-runner/dist/index.js'

          const root = realpathSync(process.env.ARTIFACT_ROOT)
          const expectedNames = ['plan.json', 'production-run-config.json', 'shards.json']
          const entries = readdirSync(root, { withFileTypes: true })
          const names = entries.map(({ name }) => name)
          if (
            names.length !== expectedNames.length ||
            expectedNames.some((name) => !names.includes(name))
          ) {
            throw new Error('The same-run plan artifact must contain exactly three frozen authority files')
          }
          for (const entry of entries) {
            const target = join(root, entry.name)
            const stat = lstatSync(target)
            const displacement = relative(root, realpathSync(target))
            if (
              !entry.isFile() ||
              !stat.isFile() ||
              stat.isSymbolicLink() ||
              displacement === '..' ||
              displacement.startsWith(`..${sep}`) ||
              isAbsolute(displacement) ||
              stat.size < 2 ||
              stat.size > 16_777_216
            ) {
              throw new Error(`The same-run plan artifact file ${entry.name} is not admitted`)
            }
          }
          const rawConfig = JSON.parse(readFileSync(join(root, 'production-run-config.json'), 'utf8'))
          const plan = JSON.parse(readFileSync(join(root, 'plan.json'), 'utf8'))
          const config = requireProductionAgentEvaluationFrozenRunConfig(
            decodeAgentEvaluationFrozenRunConfig(rawConfig, {
              clock: () => rawConfig.plannedAt,
              expectedRepositoryCommit: process.env.EXPECTED_COMMIT,
            }),
            process.env.EXPECTED_COMMIT,
          )
          const qualificationProbeCount = Object.values(
            config.qualificationAuthorityBundle.capabilityProbeAuthorities,
          ).reduce((count, authorities) => count + Object.keys(authorities).length, 0)
          const runtimeFactSourceCount = Object.values(
            config.qualificationAuthorityBundle.runtimeFactSourceAuthorities,
          ).reduce((count, authorities) => count + Object.keys(authorities).length, 0)
          const providerResourceCleanupReceiptCount = Object.values(
            config.qualificationAuthorityBundle.providerResourceCleanupReceipts,
          ).reduce((count, receipts) => count + Object.keys(receipts).length, 0)
          const probeProviderResourceAuthorityCount = Object.values(
            config.probeProviderResourceAuthorityBundle.authorities,
          ).reduce((count, authorities) => count + Object.keys(authorities).length, 0)
          const preplanAuthorityOperationCount =
            probeProviderResourceAuthorityCount +
            runtimeFactSourceCount +
            qualificationProbeCount +
            providerResourceCleanupReceiptCount
          if (
            config.plan.repositoryCommit !== process.env.EXPECTED_COMMIT ||
            config.plan.planDigest !== plan.planDigest ||
            config.plan.plannedAt !== plan.plannedAt ||
            config.plan.expiresAt !== plan.expiresAt ||
            config.plan.plannedJourneyCount !== 14_040 ||
            probeProviderResourceAuthorityCount !== 4 ||
            Object.hasOwn(
              config.probeProviderResourceAuthorityBundle.authorities,
              'anthropic-messages',
            ) ||
            qualificationProbeCount !== 18 ||
            runtimeFactSourceCount !== 15 ||
            providerResourceCleanupReceiptCount !== 4 ||
            preplanAuthorityOperationCount !== 41
          ) {
            throw new Error('The prior-attempt generated config drifted from the same-run plan authority')
          }
